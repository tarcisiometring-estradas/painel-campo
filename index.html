<style>

:root[data-tema="sol"]{--r-colh:#C9A24E;--r-meio:#3F6B4A;--r-novo:#8FB08A;--r-sem:#CFC8BC;--r-cad:#000;--r-sel:#B0402A;--r-ln:rgba(0,0,0,.5);--bg:#FFFFFF;--sf:#FFFFFF;--ln:#3A3A3A;--ink:#000;--mut:#1F1F1F;--tal:#F4E9C8;--tall:#8A7A4A;--np:#6E726B;--zero:#D0453A;--ok:#00702A}
:root{--r-colh:#B8954A;--r-meio:#4F7A5A;--r-novo:#7E9A78;--r-sem:#4A463F;--r-cad:#D8C3B0;--r-sel:#D08A70;--r-ln:rgba(0,0,0,.35);--bg:#1F2420;--sf:#262C27;--ln:#353C36;--ink:#E8EAE4;--mut:#A3AAA2;--tal:#3A3526;--tall:#6B6247;
  --ok:#2E8B57;--and:#E0A100;--prep:#3B7DD8;--zero:#E58B83;--np:#A9ADA6;--mk:#B07CE8;--gps:#1A73E8;--danger:#F08A80}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
svg#mapa{position:fixed;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--bg)}
.tal{fill:var(--tal);stroke:var(--tall);stroke-width:1;vector-effect:non-scaling-stroke}
.tr{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:var(--tw,3px);vector-effect:non-scaling-stroke}
.s-pronto,.s-g-ok{stroke:var(--ok)}.s-agulhado,.s-g-and{stroke:var(--and)}.s-preparo{stroke:var(--prep)}.s-falta,.s-g-zero{stroke:var(--zero)}
.s-nc,.s-g-np,.s-g-fora{stroke:var(--np);stroke-width:calc(var(--tw,3px)*.55);stroke-dasharray:6 5}
.alt.s-pronto,.alt.s-g-ok{stroke:#1F6E43}.alt.s-agulhado,.alt.s-g-and{stroke:#B98400}.alt.s-preparo{stroke:#2A62B0}.alt.s-falta,.alt.s-g-zero{stroke:#C9655C}
.tr.sel{stroke-width:calc(var(--tw,3px)*1.9)}
.rod{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.rod.F{stroke:#7A6A5E;stroke-width:2.6px}.rod.E{stroke:#9C948A;stroke-width:1.6px}.rod.E.t{stroke-dasharray:5 4}
.rodl{font:600 11px system-ui,sans-serif;fill:var(--mut);paint-order:stroke;stroke:var(--bg);stroke-width:3px;text-anchor:middle}
.viz{fill:none;stroke-width:1.6px;stroke-opacity:.8;stroke-linecap:round;vector-effect:non-scaling-stroke}
.hit{fill:none;stroke:transparent;stroke-width:26;vector-effect:non-scaling-stroke}
.nb text{font:700 10.5px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.nb circle{fill:transparent}.nb.sel circle{fill:var(--ink)}.nb.sel text{fill:var(--bg);stroke:none}
.tt{font:700 12px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--tal);stroke-width:3px}
.ts{font:500 9.5px system-ui,sans-serif;fill:var(--mut);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--tal);stroke-width:3px}
svg#reg{position:fixed;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--bg);display:none}
body.regiao svg#reg{display:block}body.regiao svg#mapa{display:none}
.rf{stroke:var(--r-ln);stroke-width:.6px;vector-effect:non-scaling-stroke;fill-opacity:.85;cursor:pointer}.rf.colh{fill:var(--r-colh)}.rf.meio{fill:var(--r-meio)}.rf.novo{fill:var(--r-novo)}.rf.sem{fill:var(--r-sem)}
.rf.cad{stroke:var(--r-cad);stroke-width:2.2px}.rf.sel{stroke:var(--r-sel);stroke-width:3px}
.rt{fill:none;stroke:var(--r-ln);stroke-width:.7px;vector-effect:non-scaling-stroke;pointer-events:none}
.rtl text{font:600 10px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.rlab{font:600 11.5px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}.rlab.cad{font-weight:800;fill:var(--r-cad)}
.pin{fill:var(--mk);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:64px;display:grid;gap:6px;z-index:2}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:12px}
#selm{width:100%;min-height:46px;padding:0 12px;font-weight:700;background:var(--sf);border:1px solid var(--ln);border-radius:12px}

.ctl{position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;display:grid;gap:8px;z-index:2}
.ctl button{width:48px;height:48px;border-radius:12px;background:var(--sf);border:1px solid var(--ln);font-size:21px;font-weight:700;cursor:pointer;display:grid;place-items:center}

#esc i{display:block;height:5px;border:2px solid var(--ink);border-top:0}
#leg{position:fixed;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:2;background:var(--sf);opacity:.92;border-radius:8px;padding:5px 8px;font-size:11px;display:flex;gap:4px 9px;flex-wrap:wrap;justify-content:flex-end;max-width:62%}

.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--ln)}
.p-pronto,.p-g-ok{background:var(--ok)}.p-agulhado,.p-g-and{background:var(--and);color:#1F2420}.p-preparo{background:var(--prep)}.p-falta,.p-g-zero{background:var(--zero);color:#1F2420}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-weight:700;cursor:pointer}

.muted{color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-weight:700}
.chips button[aria-pressed=true]{background:var(--mk);border-color:var(--mk);color:#fff}
textarea{width:100%;min-height:70px;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--sf)}
.foto{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--mk);color:var(--mk);font-weight:700;overflow:hidden}
.foto input{position:absolute;inset:0;opacity:0}
.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:#000}
.card{padding:10px 12px;display:grid;gap:4px}
#aviso{position:fixed;left:50%;transform:translateX(-50%);top:calc(110px + env(safe-area-inset-top));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;display:none;max-width:calc(100% - 32px);text-align:center}
#upd{position:fixed;left:8px;right:8px;top:calc(110px + env(safe-area-inset-top));z-index:15;display:none;padding:10px 12px;align-items:center;gap:10px;justify-content:space-between}
#home{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));display:none}
#home.on{display:block}.hw{max-width:620px;margin:0 auto;display:grid;gap:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
#home h1{margin:2px 0 0;font-size:27px;line-height:1.15}
.ok-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#223A28;color:#6DBA7F;font-size:12.5px;font-weight:700}
.choice{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;text-decoration:none;color:var(--ink)}
.choice .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--bg)}
.temas{display:flex;gap:6px;flex-wrap:wrap}.temas button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-weight:700;cursor:pointer}.temas button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.ctl button{position:relative}.ctl button .lb{display:none}
@media (min-width:900px) and (hover:hover){.ctl{grid-template-columns:auto}.ctl button{width:auto;min-width:48px;padding:0 12px;grid-auto-flow:column;gap:8px;justify-content:start;font-size:19px}.ctl button .lb{display:inline;font-size:14px;font-weight:700}}
.choice strong{display:block;font-size:18px}.choice small{color:var(--mut);font-size:13.5px}
.choice .seta{color:var(--mut);font-size:22px}
.fz{display:grid;gap:8px}
.fzb{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-weight:700;text-align:left;cursor:pointer}
.fzb small{display:block;font-weight:500;color:var(--mut);font-size:12.5px}
.bar{display:flex;gap:6px;width:100%}.bar .bt{white-space:nowrap}.bar .bt{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);font-weight:700;font-size:13px;cursor:pointer}
#b-home{min-width:48px;padding:0 12px;white-space:nowrap;min-height:46px;border-radius:12px;background:var(--sf);border:1px solid var(--ln);font-weight:700;cursor:pointer}
.toprow{display:flex;gap:6px}
#pin{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;place-items:center;padding:24px}
#pin .box{padding:22px;display:grid;gap:12px;width:min(360px,100%)}
#pin input{min-height:52px;font-size:24px;text-align:center;letter-spacing:.3em;border-radius:10px;border:1px solid var(--ln);background:var(--sf)}
</style>

<body>
<svg id="mapa" role="img" aria-label="Mapa da fazenda"></svg><svg id="reg" role="img" aria-label="Mapa da região"></svg>
<div class="top"><div class="toprow"><button id="b-home" aria-label="Voltar ao início" title="Voltar ao início">← Início</button><select id="selm" aria-label="Fazenda"></select></div><div id="sub"></div></div>
<div class="ctl">
  <button id="b-in" aria-label="Aproximar" title="Aproximar">＋<span class="lb">Aproximar</span></button>
  <button id="b-out" aria-label="Afastar" title="Afastar">－<span class="lb">Afastar</span></button>
  <button id="b-fit" aria-label="Ver a fazenda inteira" title="Ver a fazenda inteira">⤢<span class="lb">Ver a fazenda inteira</span></button>
  <button id="b-gps" aria-label="Onde estou (GPS)" title="Onde estou (GPS)">◉<span class="lb">Onde estou (GPS)</span></button>
  <button id="b-pt" aria-label="Marcar ponto" title="Marcar ponto">📍<span class="lb">Marcar ponto</span></button>
  <button id="b-menu" aria-label="Talhões, pontos e mais" title="Talhões, pontos e mais">☰<span class="lb">Talhões, pontos e mais</span></button>
</div>
<div id="info" class="box"></div>
<div id="esc"></div>
<div id="leg"></div>
<div id="upd" class="box"><span>Mapas novos disponíveis.</span><button class="btn pri" id="b-upd">Atualizar agora</button></div>
<div id="aviso"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="sh-h"><b id="sh-t"></b><button class="btn" id="sh-x">Fechar</button></div><div class="sh-b" id="sh-b"></div></div>
<div id="home"><div class="hw">
  <div><div class="eyebrow">Estradas · Projeto Sucuriú</div><h1>O que você deseja fazer?</h1></div>
  <div><span class="ok-chip">✓ Funciona sem internet</span> <span class="muted" id="h-ver"></span></div>
  <div class="temas" id="h-tema"><span class="muted" style="align-self:center">Tela:</span><button data-tema="escuro">Escuro</button><button data-tema="claro">Claro</button><button data-tema="sol">Sol (forte)</button></div>
  <button class="choice" id="h-mapa"><span class="ic">🗺️</span><span><strong>Mapa das estradas</strong><small>Todas as fazendas da região. Aproxime numa fazenda para ver os trechos.</small></span><span class="seta">›</span></button>
  <button class="choice" id="h-pontos"><span class="ic">📍</span><span><strong>Pontos marcados</strong><small id="h-np">Buraco, erosão, bueiro… com foto. Enviar pelo WhatsApp.</small></span><span class="seta">›</span></button>
  <a class="choice" id="h-painel" href="https://claude.ai/artifact/Ve7zV5K3mb87dN7z4tz2a8" target="_blank" rel="noopener"><span class="ic">📋</span><span><strong>Painel de Campo</strong><small>Microplanejamento, acompanhamento e lançamentos. Precisa de internet.</small></span><span class="seta">›</span></a>
  <div class="eyebrow" style="margin-top:6px">Fazendas</div>
  <div class="fz" id="h-fz"></div>
</div></div>
<div id="pin"><div class="box"><b style="font-size:19px">Estradas Sucuriú</b><div class="muted">Digite o código de acesso da equipe.</div><input id="pin-i" inputmode="numeric" autocomplete="off" maxlength="8"><button class="btn pri" id="pin-ok">Entrar</button></div></div>

<script>
"use strict";
/* ================= dados ================= */
let DADOS=null,LISTA=[],I=0,VB=null,sel=null;
const GPS={on:false,fix:null,watch:null,erro:"",seguir:false};
const $=s=>document.querySelector(s);
const fmt=v=>(isFinite(v)?v:0).toLocaleString("pt-BR",{maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fM=m=>m>=1000?fmt(Math.round(m/10)/100)+" km":fmt(Math.round(m))+" m";
const ST_N={pronto:"Trecho pronto",agulhado:"Agulhado",preparo:"Preparo feito",falta:"Falta preparo",nc:"Não conferido","g-zero":"Não iniciado","g-and":"Em andamento","g-ok":"Concluído","g-np":"Não previsto","g-fora":"Não previsto"};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function aviso(t){const a=$("#aviso");a.textContent=t;a.style.display="block";clearTimeout(aviso.t);aviso.t=setTimeout(()=>a.style.display="none",2800);}

/* ================= georreferência ================= */
const n2g=(M,x,y)=>{const c=M.geo;const px=c.x0+(x-c.n0)*c.s,py=c.y0+(y-c.n0)*c.s,yu=c.H-py,b=c.bb;const u=(px-b[0])/(b[2]-b[0]),v=(yu-b[1])/(b[3]-b[1]);const [BL,TL,TR,BR]=c.g;const f=i=>(1-u)*(1-v)*BL[i]+(1-u)*v*TL[i]+u*v*TR[i]+u*(1-v)*BR[i];return [f(0),f(1)];};
const g2n=(M,lat,lon)=>{let x=M.w/2,y=M.h/2;for(let i=0;i<7;i++){const p=n2g(M,x,y),px=n2g(M,x+1,y),py=n2g(M,x,y+1);const a=px[0]-p[0],b=py[0]-p[0],c=px[1]-p[1],d=py[1]-p[1],det=a*d-b*c;if(!det)break;const e0=lat-p[0],e1=lon-p[1];x+=(d*e0-b*e1)/det;y+=(-c*e0+a*e1)/det;}return [x,y];};
const dist=(a,b)=>{const R=6371008.8,r=Math.PI/180;const p1=a[0]*r,p2=b[0]*r,dp=p2-p1,dl=(b[1]-a[1])*r;return 2*R*Math.asin(Math.sqrt(Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2));};
const mpu=m=>dist(n2g(m,0,m.h/2),n2g(m,100,m.h/2))/100;

/* ================= pontos marcados (ficam no celular) ================= */
const DB={db:null,
  abrir(){return new Promise(ok=>{if(this.db)return ok(this.db);let r;try{r=indexedDB.open("estradas",1);}catch(e){return ok(null);}
    r.onupgradeneeded=()=>{r.result.createObjectStore("pontos",{keyPath:"id"});};r.onsuccess=()=>{this.db=r.result;ok(this.db);};r.onerror=()=>ok(null);});},
  async todos(){const d=await this.abrir();if(!d)return [];return new Promise(ok=>{const q=d.transaction("pontos").objectStore("pontos").getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>ok([]);});},
  async por(p){const d=await this.abrir();if(!d)throw new Error("sem banco");return new Promise((ok,er)=>{const t=d.transaction("pontos","readwrite");t.objectStore("pontos").put(p);t.oncomplete=ok;t.onerror=()=>er(t.error);});},
  async tirar(id){const d=await this.abrir();if(!d)return;return new Promise(ok=>{const t=d.transaction("pontos","readwrite");t.objectStore("pontos").delete(id);t.oncomplete=ok;t.onerror=ok;});}};
let PONTOS=[];
async function carregarPontos(){PONTOS=await DB.todos();PONTOS.sort((a,b)=>b.em.localeCompare(a.em));}
const TIPOS=["Buraco","Erosão","Bueiro / tubo","Atoleiro","Mata-burro","Ponte","Árvore caída","Outro"];

/* ================= desenho ================= */
const M=()=>LISTA[I];const sv=()=>$("#mapa");
const raz=()=>{const r=sv().getBoundingClientRect();return r.width&&r.height?r.height/r.width:1;};
function bbCont(m){if(m._bb)return m._bb;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const ad=p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);};
  m.trechos.forEach(t=>t.pts.forEach(ad));m.talhoes.forEach(t=>t.pts.forEach(ad));const g=Math.max(x1-x0,y1-y0)*0.04;
  return m._bb=x1>x0?{x:x0-g,y:y0-g,w:x1-x0+2*g,h:y1-y0+2*g}:{x:0,y:0,w:m.w,h:m.h};}
function inteiro(){const r=raz(),b=bbCont(M());let w,h;if(b.h/b.w>r){h=b.h;w=h/r;}else{w=b.w;h=w*r;}return {x:b.x+b.w/2-w/2,y:b.y+b.h/2-h/2,w,h};}
function vizinho(m){if(m._viz!=null)return m._viz;const o=LISTA.find(x=>x.cod===m.cod&&x!==m);if(!o)return m._viz="";

  const pad=Math.max(Math.max(...la)-Math.min(...la),Math.max(...lo)-Math.min(...lo))*0.6;
  const b=[Math.min(...lo)-pad,Math.min(...la)-pad,Math.max(...lo)+pad,Math.max(...la)+pad];let lab=[];
  const h=ROD.rod.filter(r=>r[3].some(p=>p[0]>=b[0]&&p[0]<=b[2]&&p[1]>=b[1]&&p[1]<=b[3])).map(r=>{const P=r[3].map(p=>g2n(m,p[1],p[0]));
    let best=null,bl=0;for(let i=1;i<P.length;i++){const l=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);if(l>bl){bl=l;best=[(P[i][0]+P[i-1][0])/2,(P[i][1]+P[i-1][1])/2];}}

  [...s.querySelectorAll(".tl")].map(g=>({g,w:+g.dataset.w/uu,h:+g.dataset.h/uu})).sort((a,b)=>b.w-a.w).forEach(o=>{const g=o.g,wN=(+g.dataset.n)*7.2+6;const [x,y]=tela(g);

  const gg=$("#gps");gg.innerHTML="";if(GPS.on&&GPS.fix){const [x,y]=g2n(m,GPS.fix.lat,GPS.fix.lon);gg.innerHTML=`<circle cx="${x}" cy="${y}" r="${GPS.fix.acc/mpu(m)}" fill="#1A73E8" fill-opacity=".15"/><circle cx="${x}" cy="${y}" r="${12*uu}" fill="#fff"/><circle cx="${x}" cy="${y}" r="${8*uu}" fill="#1A73E8"/>`;}

function info(){if(REG.on)return;const m=M();const t=sel!=null?m.trechos.find(x=>x.n===sel):null;let h="";

function gpsLigar(){if(!navigator.geolocation){GPS.on=true;GPS.erro="Este aparelho não tem GPS disponível no navegador.";info();return;}
  GPS.on=true;GPS.seguir=true;$("#b-gps").classList.add("on");
  GPS.watch=navigator.geolocation.watchPosition(p=>{GPS.fix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy||0};GPS.erro="";
    if(GPS.seguir){const m=M();const [x,y]=g2n(m,GPS.fix.lat,GPS.fix.lon);const b=bbCont(m);
      if(x>=b.x&&y>=b.y&&x<=b.x+b.w&&y<=b.y+b.h){const w=Math.min(VB.w,b.w/5);VB={x:x-w/2,y:y-w*raz()/2,w,h:w*raz()};}else{const o=LISTA.findIndex(mm=>{const [a,c]=g2n(mm,GPS.fix.lat,GPS.fix.lon);const bb=bbCont(mm);return !mm.acesso&&a>=bb.x&&c>=bb.y&&a<=bb.x+bb.w&&c<=bb.y+bb.h;});if(o>=0&&o!==I){I=o;desenhar();aviso("Você está na "+M().nome);}}

    er=>{GPS.erro=er.code===1?"Localização bloqueada. Libere a localização para este app nas configurações do celular.":"Sem sinal de GPS ainda. Vá para céu aberto.";info();},
    {enableHighAccuracy:true,maximumAge:4000,timeout:30000});info();}
function gpsDesligar(){try{navigator.geolocation.clearWatch(GPS.watch);}catch(e){}Object.assign(GPS,{on:false,fix:null,watch:null,erro:""});$("#b-gps").classList.remove("on");aplicar();info();}

function reduzir(file){return new Promise((ok,er)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):er(),"image/jpeg",.8);URL.revokeObjectURL(img.src);};img.onerror=er;img.src=URL.createObjectURL(file);});}

    const mudou=!DADOS||d.versao!==DADOS.versao;if(mudou){const id=LISTA[I]&&LISTA[I].id;DADOS=d;aplicarSit();montarLista();const k=LISTA.findIndex(m=>m.id===(id||LS.get("mapa","")));I=k>=0?k:0;desenhar();}const ms=await buscarSit(forcar);if(ms&&!mudou)desenhar();if($("#home").classList.contains("on"))home();return (mudou||ms)&&forcar;}catch(e){return false;}}

  ver(reg.installing);reg.addEventListener("updatefound",()=>ver(reg.installing));
  setInterval(()=>{if(navigator.onLine)reg.update().catch(()=>{});},30*60*1000);}).catch(()=>{});
  let recarregou=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(recarregou)return;recarregou=true;location.reload();});}

    <div class="bar">${f.mapas.map(m=>`<button class="bt" data-abre="${LISTA.indexOf(m)}">${m.acesso?"Acesso":"Estradas internas"}</button>`).join("")}</div></div>`).join("");
  $("#h-fz").querySelectorAll("[data-abre]").forEach(b=>b.onclick=()=>abrirMapa(+b.dataset.abre));}

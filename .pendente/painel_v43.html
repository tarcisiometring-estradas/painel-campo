<title>Painel de Campo Sucuriú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --m-zero2:#B5463D; --m-and2:#9C6B00; --m-ok2:#145C33; --m-np2:#6E726B;
  --m-prep:#3B7DD8; --m-prep2:#1F4F96; --mk:#7B3FB5; --m-zero:#E58B83; --m-and:#E0A100; --m-ok:#2E8B57; --m-np:#A9ADA6; --m-tal:#F7EBC6; --m-tal-l:#C9B98A;
  --bg:#F2F1EC; --surface:#FFFFFF; --sunk:#E8E7E0; --line:#D6D4CA;
  --ink:#1E2420; --muted:#5F665F; --accent:#2E6B3F; --accent-ink:#FFFFFF;
  --accent-soft:#DCEBDD; --warn:#8A5200; --warn-soft:#FBEBCF; --danger:#B3261E; --danger-soft:#F9DEDB;
  --info-soft:#E3ECF6; --focus:#1E5FA8; --scrim:rgba(20,24,21,.45);
  --ok:#2E6B3F; --ok-soft:#DCEBDD; --none:#B3261E; --none-soft:#F7E3E1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark; --m-tal:#3A3526; --m-tal-l:#6B6247; --m-np:#6E726B;
    --bg:#161A17; --surface:#1F2420; --sunk:#262C27; --line:#353C36;
    --ink:#E8EAE4; --muted:#A3AAA2; --accent:#6DBA7F; --accent-ink:#0F1A12;
    --accent-soft:#223A28; --warn:#E9B25A; --warn-soft:#3A2E17; --danger:#F08A80; --danger-soft:#3D2220;
    --info-soft:#1E2A38; --focus:#8AB8F0; --scrim:rgba(0,0,0,.6);
    --ok:#6DBA7F; --ok-soft:#223A28; --none:#F08A80; --none-soft:#3A2321;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark; --m-tal:#3A3526; --m-tal-l:#6B6247; --m-np:#6E726B;
  --bg:#161A17; --surface:#1F2420; --sunk:#262C27; --line:#353C36;
  --ink:#E8EAE4; --muted:#A3AAA2; --accent:#6DBA7F; --accent-ink:#0F1A12;
  --accent-soft:#223A28; --warn:#E9B25A; --warn-soft:#3A2E17; --danger:#F08A80; --danger-soft:#3D2220;
  --info-soft:#1E2A38; --focus:#8AB8F0; --scrim:rgba(0,0,0,.6);
  --ok:#6DBA7F; --ok-soft:#223A28; --none:#F08A80; --none-soft:#3A2321;
}
/* Modo sol: máximo contraste para ler no sol */
:root[data-modo="sol"]{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#EDEDED; --line:#3A3A3A;
  --ink:#000000; --muted:#1F1F1F; --accent:#00561C; --accent-ink:#FFFFFF;
  --accent-soft:#CDE8D2; --warn:#6B3A00; --warn-soft:#FFE08A; --danger:#A00000; --danger-soft:#FFD2CC;
  --info-soft:#CFE0F5; --focus:#0033CC; --scrim:rgba(0,0,0,.55);
  --ok:#00561C; --ok-soft:#CDE8D2; --none:#A00000; --none-soft:#FFD2CC;
}
:root[data-modo="sol"] body{font-weight:600}
:root[data-modo="sol"] .inp,:root[data-modo="sol"] .btn,:root[data-modo="sol"] .card,:root[data-modo="sol"] .choice{border-width:2px}
body{zoom:var(--zoom,1)}
.tela-btn{min-height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;white-space:nowrap}
.escopo{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.range{width:100%;accent-color:var(--accent);min-height:36px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:0 16px;padding-block:18px 120px}
h1,h2,h3{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif;font-weight:700;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:30px} h2{font-size:23px} h3{font-size:19px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.link-danger{background:transparent;border-color:transparent;color:var(--danger);justify-self:start;padding:0 4px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:grid;gap:14px}
.stack.tight{gap:8px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.lbl{font-size:14px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:500;color:var(--ink)}
textarea.inp{min-height:80px;resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bar .grow{flex:1;min-width:0}
.cloud{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.cloud.on{background:var(--ok-soft);color:var(--ok)}
.cloud.off{background:var(--warn-soft);color:var(--warn)}
/* home */
.flow{display:grid;gap:10px;margin-top:6px}
.choice{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;width:100%}
.choice .step{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700}
.choice strong{font-family:"Barlow Condensed",sans-serif;font-size:22px;display:block}
.choice .cnt{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.choice .cnt b{display:block;font-size:20px;color:var(--ink)}
.howto{background:var(--sunk);border-radius:12px;padding:14px 16px;font-size:15px}
.howto ol,.howto ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.flowline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;font-weight:600}
.flowline span.b{padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.flowline span.a{color:var(--muted)}
/* segmented, tabs */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{min-height:46px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .badge{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12px;line-height:20px}
.sec{display:grid;gap:12px;padding-block:18px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sum{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;gap:6px;align-items:baseline;padding:5px 11px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:600;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.bad{background:var(--none-soft);color:var(--none)}
.st.info{background:var(--info-soft);color:var(--focus)}
.st.neutral{background:var(--sunk);color:var(--muted)}
/* lists */
.list{display:grid;gap:10px}
.card{display:grid;gap:8px;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
button.card{cursor:pointer}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .nm{font-weight:600;min-width:0}
.card .sub{font-size:13px;color:var(--muted)}
.card .q{font-size:15px;font-weight:600;white-space:nowrap}
.card.pend{border-left:4px solid var(--warn)}
.card.okc{border-left:4px solid var(--ok)}
.card.badc{border-left:4px solid var(--none)}
.group-h{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.empty{padding:22px 16px;border:2px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}
.add-big{width:100%;min-height:56px;font-size:18px}
.msg{white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px;max-height:260px;overflow:auto}
.quote{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px;white-space:pre-wrap}
/* tables */
.tbwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tb{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
.tb th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;font-weight:700}
.tb td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
.tb td.n,.tb th.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb tr.tot td{font-weight:700;background:var(--sunk)}
.tb tr.rowlink{cursor:pointer}.tb tr.rowlink:hover td{background:var(--sunk)}
.tb td.nm2{font-weight:600}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchips button{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.fchips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lrow{display:grid;grid-template-columns:1fr 150px auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.lrow.alerta{border-left:4px solid var(--warn)}
.lrow .lname{background:transparent;border:0;text-align:left;padding:0;cursor:pointer;min-width:0}
.lrow .lname b{display:block}
.lrow .lname .sub{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lq{display:grid;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.lrow .lx{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--danger);font-weight:700;font-size:18px;cursor:pointer}
@media (max-width:520px){.lrow{grid-template-columns:1fr auto}.lrow .lq{grid-column:1/-1;grid-row:2}}
.vgroup{display:grid;gap:10px}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prog{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden;min-width:120px;flex:1;max-width:260px}
.prog i{display:block;height:100%;background:var(--ok)}
.vcard{display:grid;gap:10px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.vcard.refazer{border-color:var(--none)}
.vcard .vtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.vcard .vnome{font-size:18px;font-weight:700}
.vcard .vq{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:600;white-space:nowrap;text-align:right}
.vcard .vq small{font-size:14px;color:var(--muted)}
.vbtns{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.vb{min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;cursor:pointer}
.vb.ok{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.vb.med{border-color:var(--focus);color:var(--focus)}
.vb.nao{border-color:var(--none);color:var(--none)}
@media (max-width:520px){.vbtns{grid-template-columns:1fr 1fr}.vb.ok{grid-column:1/-1}}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
svg.mapa{display:block;width:100%;height:clamp(340px,60vh,72vh);aspect-ratio:auto!important;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.mapa .tr.zero.alt{stroke:var(--m-zero2)}.mapa .tr.and.alt{stroke:var(--m-and2)}.mapa .tr.ok.alt{stroke:var(--m-ok2)}.mapa .tr.np.alt{stroke:var(--m-np2)}
.mini .tr.zero.alt{stroke:var(--m-zero2)}.mini .tr.and.alt{stroke:var(--m-and2)}.mini .tr.ok.alt{stroke:var(--m-ok2)}
.mapa .viz{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-width:1.6px;stroke-opacity:.75;stroke:var(--m-np)}.mapa .viz.ok{stroke:var(--m-ok)}.mapa .viz.and{stroke:var(--m-and)}.mapa .viz.zero{stroke:var(--m-zero)}.mapa .viz.np,.mapa .viz.fora{stroke-dasharray:4 4}
.mapa .marco{fill:#fff;stroke:#1E2420;stroke-width:1;vector-effect:non-scaling-stroke}
@media (orientation:landscape) and (max-height:540px){
  body{zoom:calc(var(--zoom,1) * .8)}
  svg.mapa{max-height:calc(100vh / .8 - 40px)}
  .mb{width:38px;height:38px;font-size:18px;border-radius:10px}.mctl{gap:6px;top:6px;right:6px}
}
/* Mapa em tela cheia */
html.mapa-cheio,html.mapa-cheio body{overflow:hidden;overscroll-behavior:none}
.mapwrap.cheio{position:fixed;inset:0;z-index:60;border:0;border-radius:0;background:var(--surface)}
.mapwrap.cheio svg.mapa{width:100%;height:100%;max-height:none!important;aspect-ratio:auto!important}
.mapwrap.cheio .mctl{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))}
.mhead{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:76px;display:flex;gap:8px;align-items:center;pointer-events:none}
.mhead>*{pointer-events:auto}
.mtit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:14px;line-height:1.2;box-shadow:0 1px 4px rgba(0,0,0,.18);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mfoot{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;max-height:48%;overflow:auto;pointer-events:none}
.mfoot>*{pointer-events:auto;margin:0!important;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.mfoot .mtools{background:var(--surface);border-radius:12px;padding:6px;flex-wrap:nowrap;overflow-x:auto;justify-self:start;max-width:100%}
.mapwrap.cheio .escala{bottom:auto;top:calc(58px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px))}
.mapwrap.cheio .gpsinfo{margin:0}
.mfoot .mtools .btn{white-space:nowrap;min-height:40px}
@media (orientation:landscape) and (max-height:540px){.mfoot{right:auto;width:min(420px,58%);max-height:calc(100% - 96px)}}
.mapwrap.medindo svg.mapa{cursor:crosshair}
.mapa .tr,.mapa .hit,.mapa .tal,.mapa .mk-linha,.mapa .mk-area,.mapa .gps-acc,.mapa .hitp{vector-effect:non-scaling-stroke}
.mapa .mk-linha{fill:none;stroke:var(--mk);stroke-width:4;stroke-dasharray:10 6;stroke-linecap:round}
.mapa .mk-area{fill:var(--mk);fill-opacity:.22;stroke:var(--mk);stroke-width:3}
.mapa .mk-pin{fill:var(--mk);stroke:#fff;stroke-width:2}
.mapa .mk-g{cursor:pointer}.mapa .mk-g.sel .mk-linha,.mapa .mk-g.sel .mk-area{stroke-width:6}
.mapa .hitp{fill:transparent}
.mapa .draft{stroke-dasharray:none}
.mapa .mk-v{fill:#fff;stroke:var(--mk);stroke-width:3;vector-effect:non-scaling-stroke}.mapa .mk-v.last{fill:var(--mk)}
.mapa .gps-acc{fill:#1A73E8;fill-opacity:.14;stroke:#1A73E8;stroke-opacity:.5;stroke-width:1}
.mapa .gps-halo{fill:#fff}.mapa .gps-dot{fill:#1A73E8}
.mctl{position:absolute;top:8px;right:8px;display:grid;gap:6px}
.mapwrap:not(.cheio) .mb{width:40px;height:40px;font-size:19px;border-radius:10px}
.mb{width:clamp(36px,10vmin,48px);height:clamp(36px,10vmin,48px);border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.mb.on{background:#1A73E8;color:#fff;border-color:#1A73E8}
.escala{position:absolute;left:10px;bottom:10px;background:var(--surface);border-radius:8px;padding:4px 8px;font:600 12px "IBM Plex Mono",monospace;color:var(--ink);opacity:.92;display:flex;gap:8px;align-items:center}
.escala i{display:block;height:6px;border:2px solid var(--ink);border-top:0}
.gpsinfo{margin-top:8px;padding:10px 12px;border-radius:12px;background:#E8F0FE;color:#0B3D91;font-size:14px}
.gpsinfo .bad{color:var(--none);font-weight:700}
.mtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn.on{background:var(--mk);border-color:var(--mk);color:#fff}
.mkbar{display:grid;gap:8px;padding:12px;border:2px solid var(--mk);border-radius:14px;margin-bottom:10px;background:var(--surface)}
.mkread{font-size:18px}.mkread b{font-family:"IBM Plex Mono",monospace;font-size:24px}
.rec{color:var(--none);font-weight:700}
.stcard{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px;margin-bottom:14px;display:grid;gap:12px}
.sthead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.stgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.stmap{display:grid;gap:8px;align-content:start;padding:12px;border-radius:12px;background:var(--bg)}
.stmap .big{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600}
.minibtn{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px;cursor:pointer}
svg.mini{display:block;width:100%;height:auto;max-height:260px}
.mini .tal{fill:var(--m-tal);stroke:var(--m-tal-l);stroke-width:1;vector-effect:non-scaling-stroke}
.mini .tr{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.mini .tr.zero{stroke:var(--m-zero)}.mini .tr.and{stroke:var(--m-and)}.mini .tr.ok{stroke:var(--m-ok)}.mini .tr.np,.mini .tr.fora{stroke:var(--m-np);stroke-width:3}

const LKEY="painel_sucuriu_local_v2";
function LocalDB(){
  let store={};try{store=JSON.parse(localStorage.getItem(LKEY)||"{}")||{};}catch(e){}
  const subs=[];
  const persist=()=>{try{localStorage.setItem(LKEY,JSON.stringify(store));}catch(e){toast("Memória do aparelho cheia. Apague fotos antigas.");}};
  const notify=()=>setTimeout(()=>subs.forEach(s=>s()),0);
  const merge=(a,b)=>{for(const k in b){const v=b[k];if(v===undefined)continue;if(v&&typeof v==="object"&&!Array.isArray(v)&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k]))merge(a[k],v);else a[k]=clone(v);}return a;};
  const snap=(p)=>({id:p.split("/").pop(),exists:!!store[p],data:()=>store[p]?clone(store[p]):undefined,metadata:{fromCache:false,hasPendingWrites:false}});
  function doc(p){return{id:p.split("/").pop(),path:p,
    get:async()=>snap(p),
    set:async d=>{store[p]=clone(d);persist();notify();},
    update:async d=>{if(!store[p])throw{code:"invalid_argument",message:"não existe"};merge(store[p],d);persist();notify();},
    delete:async()=>{delete store[p];persist();notify();},
    onSnapshot:(nx)=>{const f=()=>nx(snap(p));subs.push(f);setTimeout(f,0);return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1);};}};}
  function collection(c){const q=()=>{const docs=Object.keys(store).filter(k=>k.startsWith(c+"/")&&k.split("/").length===c.split("/").length+1).map(snap);return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}};};
    return{path:c,doc:id=>doc(c+"/"+(id||uid())),get:async()=>q(),add:async d=>{const r=doc(c+"/"+uid());await r.set(d);return r;},
      onSnapshot:(nx)=>{const f=()=>nx(q());subs.push(f);setTimeout(f,0);return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1);};}};}
  return{doc,collection,local:true};
}

function mergeIn(a,b){for(const k in b){const v=b[k];if(v===undefined)continue;if(v&&typeof v==="object"&&!Array.isArray(v)&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k]))mergeIn(a[k],v);else a[k]=clone(v);}return a;}

let enviando=false,falhou=false;
async function enviarFila(){

      else if(op.op==="update"){try{await r.update(op.data);}catch(e){if(e&&e.code==="invalid_argument"){const g=await r.get();if(!g.exists){const base=clone(op.data);await r.set(base);}else throw e;}else throw e;}}
      else await r.delete();
      FILA.shift();salvarFila();falhou=false;}
    catch(e){const c=e&&e.code;
      if(c==="invalid_argument"||c==="quota_exceeded"||c==="transform_error"){FILA.shift();salvarFila();

      falhou=true;break;}}}
  finally{enviando=false;chipFila();}

/* ================= cálculos: previsto, realizado, conferência ================= */
function statusDe(l,v){if(!v||!v.st)return "pend";if(v.qual==="refazer")return "refazer";if(v.st==="nao")return "nao";const q=qtdDe(l);return Math.abs(n0(v.q)-q)<1e-9?"ok":"parcial";}
const ST_TXT={pend:"A conferir",ok:"Confere",parcial:"Medida corrigida",nao:"Não confere",refazer:"Refazer"};
const ST_CLS={pend:"warn",ok:"ok",parcial:"info",nao:"bad",refazer:"bad"};
function todasLinhas(){
  const out=[];
  for(const lc of Object.values(DATA.lanc)){for(const l of vivos(lc.linhas)){const v=(lc.val||{})[l.id]||null;const st=statusDe(l,v);
    out.push({lc,l,v,st,q:qtdDe(l),qv:(st==="ok"||st==="parcial")?n0(v.q):0});}}
  return out;
}
function usadosEm(excetoId){const u={};for(const r of Object.values(DATA.rdo)){if(r.status==="fechada"&&r.id!==excetoId)for(const k in (r.usados||{}))u[k]=r.id;}return u;}
function haDe(faz){const k=fk(faz);const L=Object.values(DATA.lanc).filter(l=>fk(l.fazenda)===k&&l.ha&&l.ha.dia!==""&&l.ha.dia!=null).sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  if(!L.length)return null;const porFrente={};
  L.forEach(l=>{const f=l.frente||"—";const r=porFrente[f]||(porFrente[f]={frente:f,eps:l.eps,dias:[],soma:0});r.dias.push({data:l.data,ha:n0(l.ha.dia)});r.soma+=n0(l.ha.dia);});
  const ult=[...Object.values(DATA.lanc)].filter(l=>fk(l.fazenda)===k&&l.imp).sort((a,b)=>(b.data||"").localeCompare(a.data||""))[0];
  const fim=Object.values(DATA.lanc).filter(l=>fk(l.fazenda)===k&&l.imp&&l.imp.finalizada).sort((a,b)=>(a.data||"").localeCompare(b.data||""))[0];
  return {frentes:Object.values(porFrente),inicio:ult&&ult.imp.inicio,entrega:ult&&ult.imp.entrega,finalizada:fim?fim.data:""};}
function pxrDe(faz,det){
  const k0=fk(faz);const rows={};
  const key=it=>gk(it)+(det?"|"+String(it.talhao||"").trim()+"|"+String(it.trecho||"").trim():"");
  const row=(k,it)=>rows[k]||(rows[k]={k,nome:gkNome(gk(it),it),un:unDe(it),talhao:det?(it.talhao||""):"",trecho:det?(it.trecho||""):"",prev:0,inf:0,val:0,pen:0,nao:0,fora:foraEscopo(it)});
  for(const o of levsDaFazenda(faz))for(const it of vivos(o.itens))row(key(it),it).prev+=qtdDe(it);
  for(const x of todasLinhas()){if(fk(x.lc.fazenda)!==k0)continue;const r=row(key(x.l),x.l);r.inf+=x.q;
    if(x.st==="ok"||x.st==="parcial")r.val+=x.qv;else if(x.st==="pend")r.pen+=x.q;else r.nao+=x.q;}
  return Object.values(rows).sort((a,b)=>(b.prev>0)-(a.prev>0)||a.nome.localeCompare(b.nome)||String(a.talhao).localeCompare(String(b.talhao))||String(a.trecho).localeCompare(String(b.trecho)));
}
function semaforo(r){
  if(!r.prev)return r.val?{c:"warn",t:"Não planejado"}:{c:"neutral",t:"Só informado"};
  const p=r.val/r.prev;
  if(p>1.1)return {c:"warn",t:"Acima do planejado"};
  if(p>=0.999)return {c:"ok",t:"Concluído"};
  if(p>0)return {c:"warn",t:"Em andamento"};
  return {c:"bad",t:"Não iniciado"};
}
function chaveRdo(it){const c=codDe(it);return c?"C:"+c:(it.fam?"F:"+it.fam:"X:"+norm(it.nome||""));}
function conferir(r){
  const usados=usadosEm(r.id);const lines=[];let jaUsadas=0,semCod=0;
  for(const x of todasLinhas()){
    if(x.st!=="ok"&&x.st!=="parcial")continue;
    const d=x.lc.data||"";if(r.de&&d<r.de)continue;if(r.ate&&d>r.ate)continue;
    if(r.fazenda&&fk(x.lc.fazenda)!==fk(r.fazenda))continue;
    if(r.eps&&norm(x.lc.eps||"")!==norm(r.eps))continue;
    const kk=x.lc.id+"|"+x.l.id;if(usados[kk]){jaUsadas++;continue;}
    if(x.l.fam&&!codDe(x.l))semCod++;
    lines.push(x);
  }
  const rows={};const row=(k,nome,un)=>rows[k]||(rows[k]={k,nome,un,rdo:0,val:0,n:0,temRdo:false});
  for(const it of vivos(r.linhas)){const k=chaveRdo(it);const w=row(k,nomeDe(it),unDe(it));w.rdo+=n0(it.q);w.temRdo=true;}
  for(const x of lines){const k=chaveRdo(x.l);const w=row(k,nomeDe(x.l),unDe(x.l));w.val+=x.qv;w.n++;}
  const lista=Object.values(rows).map(w=>{let s;
    if(!w.temRdo)s={c:"neutral",t:"Validado, não cobrado"};
    else if(w.val<=0)s={c:"bad",t:"Sem contraprova"};
    else if(w.rdo>w.val+1e-9)s={c:"warn",t:"RDO acima do validado"};
    else s={c:"ok",t:"Tem contraprova"};
    return Object.assign(w,{dif:w.rdo-w.val,s});}).sort((a,b)=>(b.temRdo-a.temRdo)||a.nome.localeCompare(b.nome));
  return {lista,lines,jaUsadas,semCod};
}

/* Meta de hectares concluídos por dia na implantação. Editável em Planejado × Executado (fica em config/metas). */
const META_PADRAO={padrao:90,arauco:45,frentes:{IMP01:90,IMP02:90,IMP03:90,IMP04:45}};
function cfgMetas(){const c=(DATA.config&&DATA.config.metas)||{};return {padrao:n0(c.padrao)||META_PADRAO.padrao,arauco:n0(c.arauco)||META_PADRAO.arauco,frentes:Object.assign({},META_PADRAO.frentes,c.frentes||{})};}
const chFrente=f=>{const s=String(f||"").toUpperCase().replace(/[^A-Z0-9]/g,"");const m=s.match(/IMP(\d+)$/);return m?"IMP"+m[1].padStart(2,"0"):s;};
function metaDe(frente,eps){const c=cfgMetas();if(/arauco/i.test(String(eps||""))||/ARAUCO/.test(chFrente(frente)))return c.arauco;const k=chFrente(frente);return k&&c.frentes[k]!=null?n0(c.frentes[k]):c.padrao;}
const EPS_BASE=["FERMAQ","Casa Grande","Hidroplan","GTM","Geopampa","Arauco (própria)"];
function nomeEPS(e){const t=String(e||"").trim();if(!t)return "";const kk=x=>fk(x).replace(/[^a-z0-9]/g,"").replace(/[qk]/g,"c").replace(/ss/g,"s");const k=kk(t);const todas=[...EPS_BASE,...listaEPS()];
  const m=todas.find(x=>kk(x)===k)||todas.find(x=>{const y=kk(x);return y.length>2&&(k.includes(y)||y.includes(k));});return m||t;}
function listaEPS(){const s=new Set(EPS_BASE);Object.values(DATA.os).forEach(o=>o.eps&&s.add(o.eps));Object.values(DATA.lanc).forEach(l=>l.eps&&s.add(l.eps));return [...s].sort();}

function paLarg(M,l,ext){const n=numTrecho(l.trecho);if(M&&n!=null){const t=(M.trechos||[]).find(x=>x.n===n);if(t)return /secund/i.test(tipoTr(M,t,tcDe(M,n)))?"Secundária (4m)":"Primária (7m)";}
  const lg=n0(l.l);if(lg>0&&lg<5.5)return "Secundária (4m)";if(lg>=5.5)return "Primária (7m)";return ext?"Primária (7m)":"";}
function paObra(l){const c=+(codDe(l)||l.cod||0);const nm=norm(nomeDe(l));if(c===79||/aterro/.test(nm))return "Aterro";if(/bueiro|tubo|manilha/.test(nm))return "Bueiro";if(c===77||/tap+er/.test(nm))return "Tapper";if(/ponte/.test(nm))return "Ponte";if(c===76||/captac/.test(nm))return "";return null;}
function paErosao(l){const c=+(codDe(l)||l.cod||0);return c>=1&&c<=16;}
/* linhas do dia, já somadas no formato do Power Apps */
function paCore(dt){const P=cfgPA();const A={},S={};const AG=[];let fora=0;const semFr=new Set(),semRf=new Set();
  const FR=lc=>lc.frente?paFrente(lc.frente,lc.eps):"";const ini={};for(const lc of Object.values(DATA.lanc)){const k=kc(paFazBase(lc.fazenda))+"|"+kc(FR(lc));if(lc.data&&(!ini[k]||lc.data<ini[k]))ini[k]=lc.data;}
  for(const lc of Object.values(DATA.lanc)){if(lc.data!==dt)continue;
    const fin=finLanc(lc)||"abastecimento";const frente=FR(lc);const cad=frenteCad(frente);const fz=paFazBase(lc.fazenda)||"SEM FAZENDA";
    const i=lc.imp||{};const tec=(cad&&cad.tec)||i.tecnico||nomePessoa(lc.por);const sup=(cad&&cad.sup)||i.supervisor||"";
    const rf=P.faz[kc(fz)]||"";if(!frente)semFr.add(lc.fazenda||fz);if(!rf)semRf.add(fz);
    const o0=[];if(lc.obsAp)o0.push(lc.obsAp);
    if(fin==="implantacao"){const ls=vivos(lc.linhas);const temHa=lc.ha&&lc.ha.dia!==""&&lc.ha.dia!=null;let op,un,obra="",q=0;
      if(temHa){op="Implantação";un="ha";q=n0(lc.ha.dia);}
      else{const ob=ls.map(paObra).filter(x=>x!==null);
        if(ob.length){op="Obra de Arte";un="m³";obra=ob.find(Boolean)||"";}
        else if(ls.some(paErosao)){op="Controle de Erosões";un="hrs";}
        else{op=/^acesso/.test(fk(lc.fazenda))?"Acessos Externos":"Acessos Internos";un="m³";}}
      const k0=kc(fz)+"|"+kc(frente);const o=[];
      if(!temHa&&ini[k0]===dt)o.push("Início das atividades "+fD(dt).slice(0,5));
      if(i.finalizada)o.push("Fazenda finalizada");else if(i.entrega)o.push("Previsão de término "+fD(i.entrega).slice(0,5));else if(!temHa&&ini[k0]&&ini[k0]<dt)o.push("Em andamento desde "+fD(ini[k0]).slice(0,5));
      const key=[tec,frente,fz,op].join("|");const r=S[key]||(S[key]={cli:"Silvicultura",tec,sup,rf,faz:fz,frente,op,un,obra,q:0,obs:new Set(),tr:new Set()});
      r.q+=q;[...o,...o0].forEach(x=>r.obs.add(x));if(!r.obra&&obra)r.obra=obra;continue;}
    for(const l of vivos(lc.linhas)){const sv=servDe(l);const M=mapaDaLinha(lc,l);const ext=paExt(lc,l,M);let op=null,un="m",q=0,obra="";
      if(sv==="preparo"){op=ext?"Acessos externos":"Acessos internos";q=metrosDe(l,null);}
      else if(sv==="cascalho"){op=ext?"Cascalhamento externo":"Cascalhamento interno";q=metrosDe(l,null);}
      else if(sv==="agulhada"){AG.push({tec,faz:fz,frente,tr:l.trecho||"",m:metrosDe(l,null)});continue;}
      else{const ob=paObra(l);if(ob===null){fora++;continue;}op="Obras de Arte";un=unDe(l)==="m³"?"m³":unDe(l);q=qtdDe(l);obra=ob;}
      const lg=op.startsWith("Obras")?"":paLarg(M,l,ext);
      const key=[tec,frente,fz,op,lg,obra].join("|");const r=A[key]||(A[key]={cli:"Abastecimento",tec,sup,rf,faz:fz,frente,op,un,obra,lg,q:0,obs:new Set(o0),tr:new Set()});
      r.q+=q;if(l.trecho)r.tr.add(String(l.trecho).trim());}}
  const fin=r=>{const o=[...r.obs];if(r.tr&&r.tr.size)o.unshift("Trecho"+(r.tr.size>1?"s ":" ")+[...r.tr].sort((a,b)=>(numTrecho(a)??999)-(numTrecho(b)??999)||a.localeCompare(b)).join(", "));r.obsTxt=o.join(" · ")||".";r.q=Math.round(r.q*100)/100;return r;};
  const ord=(a,b)=>a.tec.localeCompare(b.tec)||a.frente.localeCompare(b.frente)||a.faz.localeCompare(b.faz)||a.op.localeCompare(b.op);
  return {A:Object.values(A).map(fin).sort(ord),S:Object.values(S).map(fin).sort(ord),AG,fora,semFr:[...semFr],semRf:[...semRf]};}
/* frentes que lançaram nos 10 dias antes e nada no dia: entram com 0 e o motivo, se o técnico marcar */
function paSemLanc(dt,D,zero){const tem=new Set([...D.A,...D.S].map(r=>r.frente).filter(Boolean));const d0=new Date(dt+"T12:00:00");d0.setDate(d0.getDate()-10);const lim=d0.toISOString().slice(0,10);
  const ult={};for(const lc of Object.values(DATA.lanc)){const f=lc.frente?paFrente(lc.frente,lc.eps):"";if(!f||tem.has(f)||!lc.data||lc.data>=dt||lc.data<lim)continue;if(!ult[f]||lc.data>ult[f])ult[f]=lc.data;}
  const out=[];for(const [f,d] of Object.entries(ult)){const C=paCore(d);const rs=[...C.A,...C.S].filter(r=>r.frente===f);if(!rs.length)continue;
    const vist=new Set();for(const r0 of rs){const k=r0.faz+"|"+r0.op.replace(/ (in|ex)terno$/i,"");if(vist.has(k))continue;vist.add(k);
      out.push(Object.assign({},r0,{q:0,tr:new Set(),obsTxt:zero[f]||"",ult:d,zero:true}));}}
  return out.sort((a,b)=>a.tec.localeCompare(b.tec)||a.frente.localeCompare(b.frente));}
function pappsDados(dt,zero){const D=paCore(dt);const Z=paSemLanc(dt,D,zero||{});const ok=Z.filter(r=>r.obsTxt);
  D.A=D.A.concat(ok.filter(r=>r.cli==="Abastecimento"));D.S=D.S.concat(ok.filter(r=>r.cli!=="Abastecimento"));D.Z=Z;return D;}

function paLinhaA(r,dt){return [r.faz,r.rf,r.sup,r.tec,fD(dt),"Abastecimento",r.frente,r.op,r.q,r.un,r.obra||"",r.obsTxt,r.lg||""];}
function paLinhaS(r,dt){return [r.faz,r.sup,r.tec,fD(dt),r.frente,"Silvicultura",r.rf,r.op,r.q,r.un,r.obra||"",r.obsTxt];}

  const A=paFiltro(D.A,tf),S=paFiltro(D.S,tf),Z=paFiltro(D.Z,tf);

  const tot=rs=>{const m=rs.filter(r=>r.cli==="Abastecimento"&&r.un==="m").reduce((a,r)=>a+r.q,0);const ha=rs.filter(r=>r.op==="Implantação").reduce((a,r)=>a+r.q,0);return [m?`${fmt(m)} m lineares`:"",ha?`${fmt(ha)} ha liberados`:""].filter(Boolean).join(" · ");};
  const nada=!A.length&&!S.length;
  return `<div class="muted small">Montado a partir das mensagens dos encarregados já lançadas no painel, no mesmo formato das listas do Power Apps. Abastecimento: metros lineares de preparo de leito e de preparo com brita por frente. Implantação: hectares liberados por frente; construtiva e obra de arte só com início, andamento e fim.</div>

  ${D.semRf.length?`<div class="note">Fazenda sem regional (RF) cadastrada: ${D.semRf.map(esc).join(", ")}.${ADM?` Cadastre em <b>Frentes e regionais</b>.`:" Avise o supervisor."}</div>`:""}
  ${D.fora?`<div class="muted small">${D.fora} linha(s) de outras atividades (escavação, transporte, horas…) não entram no Power Apps; seguem no acompanhamento normal.</div>`:""}

/* ---------- conferência pelo ACUMULADO do trecho ---------- */
/* Os lançamentos diários do encarregado são somados por fazenda + trecho + atividade. O técnico confere o acumulado, não dia a dia. */
function chaveAc(x){const tr=String(x.l.trecho||"").trim().toLowerCase();const tl=String(x.l.talhao||"").trim().toLowerCase();
  return fk(x.lc.fazenda||"")+"|"+(tr?"T:"+tr:tl?"L:"+tl:"-")+"|"+(codDe(x.l)?"C:"+codDe(x.l):gk(x.l));}
function compTrecho(x){const M=mapaDaLinha(x.lc,x.l);const n=numTrecho(x.l.trecho);if(!M||n==null)return 0;const t=(M.trechos||[]).find(t=>t.n===n);if(!t)return 0;const d=DATA.trechos&&DATA.trechos[M.id+"__"+n];return d&&d.km!=null&&d.km!==""?n0(d.km)*1000:(t.m||0);}
function gruposAc(L){const G={};
  for(const x of L){const k=chaveAc(x);const g=G[k]||(G[k]={k,faz:x.lc.fazenda||"Sem fazenda",trecho:String(x.l.trecho||"").trim(),talhao:String(x.l.talhao||"").trim(),nome:nomeDe(x.l),un:unDe(x.l),itens:[],inf:0,val:0,pend:0,nao:0,mInf:0,mPend:0,mVal:0,eps:new Set(),ult:""});
    g.itens.push(x);g.inf+=x.q;const mi=metrosDe(x.l,null);g.mInf+=mi;if(x.lc.eps)g.eps.add(x.lc.eps);
    if(x.st==="pend"||x.st==="refazer"){g.pend+=x.q;g.mPend+=mi;}else if(x.st==="ok"||x.st==="parcial"){g.val+=x.qv;g.mVal+=metrosDe(x.l,x.v);if(String(x.v.em||"")>g.ult)g.ult=x.v.em;}else g.nao+=x.q;}
  for(const g of Object.values(G)){g.itens.sort((a,b)=>(a.lc.data||"").localeCompare(b.lc.data||"")||(a.l.ord||0)-(b.l.ord||0));
    g.mTr=compTrecho(g.itens[0]);g.passa=g.mTr>0&&g.mInf>g.mTr*1.05;g.nPend=g.itens.filter(x=>x.st==="pend"||x.st==="refazer").length;
    g.dias=new Set(g.itens.map(x=>x.lc.data)).size;g.de=g.itens[0].lc.data;g.ate=g.itens[g.itens.length-1].lc.data;}
  return Object.values(G).sort((a,b)=>a.faz.localeCompare(b.faz)||(numTrecho(a.trecho)??9999)-(numTrecho(b.trecho)??9999)||a.trecho.localeCompare(b.trecho)||a.nome.localeCompare(b.nome));}

function grupoPorChave(k){return gruposAc(todasLinhas()).find(g=>g.k===k)||null;}
function dimsUniformes(P){if(!P.length)return null;const t=tipoUn(unDe(P[0].l));if(t==="cont")return null;
  const l=n0(P[0].l.l),e=n0(P[0].l.e);if(!l||P.some(x=>n0(x.l.l)!==l||(t==="volume"&&n0(x.l.e)!==e)||!n0(x.l.c)||pn(x.l.direto)>=0))return null;return {t,l,e,eu:eUnDe(P[0].l)};}

async function salvarGrupo(s){
  const g=grupoPorChave(s.k);if(!g)return false;const d=s.d;const P=g.itens.filter(x=>x.st==="pend"||x.st==="refazer");if(!P.length)return false;
  if(!d.st){toast("Marque se o acumulado confere.");return false;}
  if(d.st!=="nao"&&!d.qual){toast("Marque se a qualidade está aprovada ou se precisa refazer.");return false;}
  let T=d.st==="med"?vgQtd(s):g.pend;if(d.st==="med"&&!(T>=0)){toast("Informe a medida conferida.");return false;}
  if((d.st==="med"||d.st==="nao"||d.qual==="refazer")&&!String(d.mot||"").trim()){toast("Escreva o motivo.");return false;}
  const em=new Date().toISOString();const por=quem();const porLc={};let rest=T;
  const sv=v=>String(+(+v).toFixed(3)).replace(".",",");
  P.forEach((x,i)=>{const {lc,l}=x;const v0=(lc.val||{})[l.id];const hist=v0&&v0.st?[...(v0.hist||[]),Object.assign({},v0,{hist:undefined})].slice(-10):[];
    let reg;
    if(d.st==="nao")reg={st:"nao",med:false,qual:"",q:0};
    else if(d.st==="sim")reg={st:"sim",med:false,qual:d.qual,q:x.q};
    else{const a=i===P.length-1?Math.max(rest,0):Math.min(x.q,Math.max(rest,0));rest-=a;reg={st:"sim",med:Math.abs(a-x.q)>1e-9,qual:d.qual,q:a};
      if(reg.med){const t=tipoUn(unDe(l));const f=x.q?a/x.q:0;if(t==="cont")reg.u=sv(a);else if(n0(l.c)&&!(pn(l.direto)>=0)){reg.c=sv(n0(l.c)*f);reg.l=l.l||"";reg.e=l.e||"";reg.direto="";}else{reg.direto=sv(a);reg.l=l.l||"";reg.e=l.e||"";}}}
    Object.assign(reg,{mot:String(d.mot||"").trim(),fotos:d.fotos||[],por,em,hist,grupo:{k:g.k,tot:T,n:P.length}});
    (porLc[lc.id]=porLc[lc.id]||{})[l.id]=reg;});
  for(const id in porLc){if(!await escrever(()=>DB.doc("lanc/"+id).update(clone({val:porLc[id]})),null))return false;const lc=DATA.lanc[id];if(lc){lc.val=lc.val||{};Object.assign(lc.val,porLc[id]);}}
  toast(d.qual==="refazer"?"Registrado: refazer.":d.st==="nao"?"Registrado: não confere.":`Conferido: ${fmt(T)} ${g.un} no ${g.trecho?"trecho "+g.trecho:"local"}.`);return true;}

/* ================= MAPA DAS ESTRADAS ================= */
/* Mapas cadastrados pelo Claude a partir dos PDFs da Geoplant (coleção "mapas"). O andamento sai das linhas conferidas em campo. */
/* O mapa acompanha só o revestimento com brita: preparo de leito com brita (35) e agulhamento (21 = material lançado). */
const SERV={preparo:{t:"Preparo de leito",fam:"PLS",cods:[36]},agulhada:{t:"Agulhamento (material lançado)",cods:[21]},cascalho:{t:"Preparo de leito com brita",cods:[35]}};
const SERV_PRINC=["preparo","agulhada","cascalho"];
function servDe(l){const c=+(codDe(l)||l.cod||0);for(const k in SERV){const s=SERV[k];if(s.fam&&l.fam===s.fam)return k;if(c&&s.cods.includes(c))return k;}return null;}
function metrosDe(l,v){const src=v&&v.med?Object.assign({},l,{c:v.c,l:v.l,e:v.e,direto:v.direto}):l;const c=n0(src.c);if(c>0)return c;
  const q=v&&v.st?n0(v.q):qtdDe(l);const t=tipoUn(unDe(l));const lg=n0(src.l);if(!lg||!q)return 0;
  if(t==="area")return q/lg;if(t==="volume"){const e=n0(src.e)/(eUnDe(l)==="m"?1:100);return e?q/(lg*e):0;}return 0;}
const numTrecho=tr=>{const m=String(tr||"").match(/\d+/);return m?+m[0]:null;};
function mapaDaLinha(lc,l){
  const f0=fk(lc.fazenda);const ac=/^acesso/.test(f0)||/acesso|extern/.test(norm(l.trecho||""));
  const f=f0.replace(/^acesso\s+(a|à|ao|da|de)?\s*(fazenda\s+)?/,"").replace(/^fazenda\s+/,"");
  return Object.values(DATA.mapas).find(M=>!!M.acesso===ac&&(M.apelidos||[]).some(a=>{const k=fk(a);return k&&(f===k||f.includes(k)||(f.length>3&&k.includes(f)));}))||null;}
function progressoMapa(M){
  const R={};(M.trechos||[]).forEach(t=>R[t.n]={t,s:{},M});
  for(const t of M.trechos||[]){const d=tcDe(M,t.n);if(!d||!d.base)continue;for(const k in d.base){if(!SERV[k])continue;const m=n0(d.base[k]);if(!m)continue;
    const S=R[t.n].s[k]||(R[t.n].s[k]={val:0,inf:0,pend:0,emp:{},ult:""});S.val+=m;S.inf+=m;S.emp["Antes do painel"]=(S.emp["Antes do painel"]||0)+m;S.base=(S.base||0)+m;if(String(d.baseEm||"")>S.ult)S.ult=d.baseEm||"";}}
  for(const x of todasLinhas()){const k=servDe(x.l);if(!k)continue;const m=mapaDaLinha(x.lc,x.l);if(!m||m.id!==M.id)continue;const n=numTrecho(x.l.trecho);if(!R[n])continue;
    const S=R[n].s[k]||(R[n].s[k]={val:0,inf:0,pend:0,emp:{},ult:""});const mi=metrosDe(x.l,null);S.inf+=mi;
    if(x.st==="ok"||x.st==="parcial"){const mv=metrosDe(x.l,x.v);S.val+=mv;const e=x.lc.eps||"Sem empresa";S.emp[e]=(S.emp[e]||0)+mv;if(String(x.v.em||"")>S.ult)S.ult=x.v.em;}
    else if(x.st==="pend")S.pend+=mi;}
  return R;}
function estadoTrecho(r,k){const prev=prevServ(r.t,k);const S=r.s[k];const feito=S?S.val:0;
  if(!prev)return {c:feito>0?"fora":"np",prev,feito,p:0};const p=feito/prev;return {c:p>=0.99?"ok":p>0?"and":"zero",prev,feito,p};}
function resumoServ(M,R,k){let prev=0,feito=0,pend=0,n=0,ok=0;for(const r of Object.values(R)){const e=estadoTrecho(r,k);if(e.prev){prev+=e.prev;feito+=Math.min(e.feito,e.prev);n++;if(e.c==="ok")ok++;}pend+=(r.s[k]?r.s[k].pend:0);}return {prev,feito,falta:Math.max(prev-feito,0),pend,n,ok};}
const ST_MAPA={zero:"Não iniciado",and:"Em andamento",ok:"Concluído",np:"Não previsto",fora:"Feito fora do previsto"};
function servsDoMapa(M){return SERV_PRINC.slice();}
const prevServ=(t,k)=>n0(t.plan&&t.plan[k])||(k==="agulhada"?n0(t.plan&&t.plan.cascalho):0);
/* Régua de entrega: o trecho fica pronto quando o SERVIÇO FINAL dele está conferido.
   Final = preparo com brita onde há brita prevista; preparo de leito onde só vai preparo. Agulhado nunca é entrega. Pode ser trocado por trecho na Tabela. */
function finalDe(M,t){const d=M&&tcDe(M,t.n);if(d&&d.entrega)return d.entrega;if(n0(t.plan&&t.plan.cascalho))return "cascalho";if(n0(t.plan&&t.plan.preparo))return "preparo";return "cascalho";}
const NOME_FINAL={cascalho:"preparo com brita",preparo:"preparo de leito"};
function liberacaoColheita(M,R){
  const acesso=Object.values(DATA.mapas).find(x=>x.acesso&&x.codigo===M.codigo);let acPct=null;
  if(acesso){const RA=progressoMapa(acesso);const s=resumoServ(acesso,RA,"cascalho");acPct=s.prev?s.feito/s.prev:null;}
  const tal=(M.talhoes||[]).filter(t=>t.vol).map(t=>{const falta=[];(t.trechos||[]).forEach(n=>{const r=R[n];if(!r)return;for(const k of [0]){const e=estadoGeral(r);if(e.prev&&e.c!=="ok"){falta.push(n);break;}}});
    const intOk=!falta.length;const lib=intOk&&(acPct==null||acPct>=0.99);return Object.assign({},t,{falta,intOk,lib});});
  const tot=n0(M.colheita&&M.colheita.volTotal)||tal.reduce((a,t)=>a+t.vol,0);const lib=tal.filter(t=>t.lib).reduce((a,t)=>a+t.vol,0);
  return {tal,acPct,tot,lib,acesso};}
/* ================= MAPA: GEORREFERÊNCIA, GPS, MEDIDAS E ANDAMENTO ================= */
/* Cada mapa guarda em "geo" o georreferenciamento do GeoPDF da Geoplant (cantos lat/lon). */
const temGeo=M=>!!(M&&M.geo&&M.geo.g&&M.geo.g.length===4);
function n2g(M,x,y){const c=M.geo;const px=c.x0+(x-c.n0)*c.s,py=c.y0+(y-c.n0)*c.s,yu=c.H-py,b=c.bb;
  const u=(px-b[0])/(b[2]-b[0]),v=(yu-b[1])/(b[3]-b[1]);const [BL,TL,TR,BR]=c.g;
  const f=i=>(1-u)*(1-v)*BL[i]+(1-u)*v*TL[i]+u*v*TR[i]+u*(1-v)*BR[i];return [f(0),f(1)];}
function g2n(M,lat,lon){let x=M.w/2,y=M.h/2;
  for(let i=0;i<6;i++){const p=n2g(M,x,y),px=n2g(M,x+1,y),py=n2g(M,x,y+1);
    const a=px[0]-p[0],b=py[0]-p[0],c=px[1]-p[1],d=py[1]-p[1],det=a*d-b*c;if(!det)break;
    const e0=lat-p[0],e1=lon-p[1];x+=(d*e0-b*e1)/det;y+=(-c*e0+a*e1)/det;}
  return [x,y];}
function distM(a,b){const R=6371008.8,r=Math.PI/180;const p1=a[0]*r,p2=b[0]*r,dp=p2-p1,dl=(b[1]-a[1])*r;
  return 2*R*Math.asin(Math.sqrt(Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2));}
function compM(pts){let s=0;for(let i=1;i<pts.length;i++)s+=distM(pts[i-1],pts[i]);return s;}
function areaM2(pts){if(pts.length<3)return 0;const la=pts.reduce((a,p)=>a+p[0],0)/pts.length,r=Math.PI/180,R=6371008.8;
  const xy=pts.map(p=>[p[1]*r*R*Math.cos(la*r),p[0]*r*R]);let s=0;for(let i=0;i<xy.length;i++){const a=xy[i],b=xy[(i+1)%xy.length];s+=a[0]*b[1]-b[0]*a[1];}return Math.abs(s)/2;}
const mpu=M=>temGeo(M)?distM(n2g(M,0,M.h/2),n2g(M,100,M.h/2))/100:1;
const fM=m=>m>=1000?fmt(Math.round(m/10)/100)+" km":fmt(Math.round(m))+" m";
const fHa=m2=>fmt(Math.round(m2/100)/100)+" ha";
const fLL=p=>p[0].toFixed(6).replace(".",",")+" ; "+p[1].toFixed(6).replace(".",",");

/* ---- "Tudo": todos os serviços previstos no trecho juntos ---- */
const nomeServ=k=>k==="tudo"?"Todos os serviços":k==="conf"?"Situação dos trechos":SERV[k].t;
function estadoGeral(r){const fin=finalDe(r.M,r.t);const d=r.M&&tcDe(r.M,r.t.n);
  if(!prevServ(r.t,fin)&&!(d&&d.entrega)){const algum=Object.values(r.s).some(x=>x.val>0);return {c:algum?"fora":"np",prev:0,feito:0,p:0,fin};}
  const prev=prevServ(r.t,fin)||n0(r.t.m);const S=r.s[fin];const feito=Math.min(S?S.val:0,prev);
  const algum=Object.values(r.s).some(x=>x.val>0);const p=prev?feito/prev:0;
  return {c:p>=0.99?"ok":algum?"and":"zero",prev,feito,p,fin};}
const estadoK=(r,k)=>k==="tudo"?estadoGeral(r):estadoTrecho(r,k);
function resumoK(M,R,k){if(k!=="tudo")return resumoServ(M,R,k);let prev=0,feito=0,pend=0,n=0,ok=0;
  for(const r of Object.values(R)){const e=estadoGeral(r);if(e.prev){prev+=e.prev;feito+=e.feito;n++;if(e.c==="ok")ok++;}for(const S of Object.values(r.s))pend+=S.pend;}
  return {prev,feito,falta:Math.max(prev-feito,0),pend,n,ok};}
function faixasT(ns){ns=[...new Set(ns)].sort((a,b)=>a-b);const out=[];let i=0;
  while(i<ns.length){let j=i;while(j+1<ns.length&&ns[j+1]===ns[j]+1)j++;out.push(j>i?(j-i>1?`T${ns[i]}–T${ns[j]}`:`T${ns[i]}, T${ns[j]}`):`T${ns[i]}`);i=j+1;}return out.join(", ");}

/* ---- vista (zoom e arrasto), GPS e desenho ---- */
const VB={};
function razao(){const sv=svgMapa();const r=sv&&sv.getBoundingClientRect();const M=mapaAtual();return r&&r.width&&r.height?r.height/r.width:(M?M.h/M.w:1);}
function bbConteudo(M){if(M._bb)return M._bb;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const add=p=>{if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1];};
  (M.trechos||[]).forEach(t=>t.pts.forEach(add));(M.talhoes||[]).forEach(t=>(t.pts||[]).forEach(add));(M.tr||[]).forEach(t=>t.pts.forEach(add));(M.tal||[]).forEach(t=>t.pts.forEach(add));
  if(!(x1>x0))return M._bb={x:0,y:0,w:M.w,h:M.h};const m=Math.max(x1-x0,y1-y0)*0.04;return M._bb={x:x0-m,y:y0-m,w:x1-x0+2*m,h:y1-y0+2*m};}
function vbInteiro(M){const r=razao();const b=bbConteudo(M);let w,h;if(b.h/b.w>r){h=b.h;w=h/r;}else{w=b.w;h=w*r;}return {x:b.x+b.w/2-w/2,y:b.y+b.h/2-h/2,w,h};}
function vbDe(M){return VB[M.id]||(VB[M.id]=vbInteiro(M));}
const GPS={on:false,seguir:false,watch:null,fix:null,erro:"",trilha:false};
const MK={modo:"",pts:[],nome:""};      /* modo: "" | linha | area | ponto */
let GEST=null,arrastou=false;
const svgMapa=()=>document.querySelector("svg.mapa");
const mapaAtual=()=>ST.tela==="geral"?GERAL.M:(DATA.mapas[ST.mapa]||null);
function pxN(sv,v,cx,cy){const r=sv.getBoundingClientRect();return [v.x+(cx-r.left)*v.w/r.width,v.y+(cy-r.top)*v.h/r.height];}
function upx(){const sv=svgMapa(),M=mapaAtual();if(!sv||!M)return 1;const r=sv.getBoundingClientRect();return r.width?vbDe(M).w/r.width:1;}
let RAF_ROT=0;
function aplicarVB(){const sv=svgMapa(),M=mapaAtual();if(!sv||!M)return;const v=vbDe(M);const nh=v.w*razao();if(Math.abs(nh-v.h)>0.01){v.y+=(v.h-nh)/2;v.h=nh;}sv.setAttribute("viewBox",`${v.x} ${v.y} ${v.w} ${v.h}`);
  /* espessura da linha acompanha o zoom: fina com o mapa inteiro, mais grossa só bem perto */
  const z=vbInteiro(M).w/v.w;const tw=Math.max(1.6,Math.min(2+1.7*Math.sqrt(Math.max(z-1,0)),7));sv.style.setProperty("--tw",tw.toFixed(2)+"px");
  if(!RAF_ROT)RAF_ROT=requestAnimationFrame(()=>{RAF_ROT=0;rotulosMapa();});}
/* Rótulos com tamanho FIXO na tela (como Google Maps/Avenza): não incham ao afastar.
   Aparecem só quando cabem e nunca encavalam. Número do trecho pequeno, sem bolinha; talhão só o número (+ ha quando cabe). */
function rotulosMapa(){const sv=svgMapa(),M=mapaAtual();if(!sv||!M)return;const v=vbDe(M);
  const r0=sv.getBoundingClientRect();const uu=r0.width?v.w/r0.width:1;const z=vbInteiro(M).w/v.w;
  const tf=(g,k)=>{const cx=+g.dataset.cx,cy=+g.dataset.cy;g.setAttribute("transform",`translate(${cx} ${cy}) scale(${k}) translate(${-cx} ${-cy})`);};
  const caixas=[];const livre=(x,y,w,h)=>{const b=[x-w/2,y-h/2,x+w/2,y+h/2];if(caixas.some(c=>b[0]<c[2]&&b[2]>c[0]&&b[1]<c[3]&&b[3]>c[1]))return false;caixas.push(b);return true;};
  const tela=g=>[(+g.dataset.cx-v.x)/uu,(+g.dataset.cy-v.y)/uu];
  const dentro=(x,y)=>x>-40&&y>-40&&x<r0.width+40&&y<r0.height+40;
  const mids=(M.trechos||[]).map(t=>t.mid).filter(Boolean);let gapM=60*uu;
  if(mids.length>1){const ds=[];for(let i=1;i<mids.length;i++)ds.push(Math.hypot(mids[i][0]-mids[i-1][0],mids[i][1]-mids[i-1][1]));ds.sort((x,y)=>x-y);gapM=ds[Math.floor(ds.length/2)]||gapM;}
  const gap=gapM/uu;
  /* 1) trecho selecionado primeiro, depois os números (prioridade sobre talhão) */
  const verNum=gap>=34;
  const nbs=[...sv.querySelectorAll(".nb")].sort((a,b)=>b.classList.contains("sel")-a.classList.contains("sel"));
  nbs.forEach(g=>{tf(g,uu);const sel=g.classList.contains("sel");const [x,y]=tela(g);
    if(!sel&&(!verNum||!dentro(x,y))){g.style.display="none";return;}
    const w=String(g.dataset.n||"").length*6.5+8;g.style.display=(livre(x,y,w,15)||sel)?"":"none";});
  /* 2) bolinhas de início/fim: pequenas, só bem perto */
  const verMq=gap>=130;sv.querySelectorAll(".mq").forEach(g=>{tf(g,uu*0.6);g.style.display=verMq?"":"none";});
  /* 3) talhões: número 12 px; área 9,5 px só se o talhão tiver espaço na tela */
  [...sv.querySelectorAll(".tl")].map(g=>({g,w:(+g.dataset.w||0)/uu,h:(+g.dataset.h||0)/uu})).sort((a,b)=>b.w-a.w).forEach(o=>{
    const g=o.g;const n=+g.dataset.n||3,ns=+g.dataset.ns||0;const wN=n*7.2+6,wS=ns*5.4+6;const [x,y]=tela(g);
    if(o.w<wN*1.6||o.h<20||!dentro(x,y)){g.style.display="none";return;}tf(g,uu);
    const sub=g.querySelector(".tal-s");const comSub=!!sub&&o.w>=wS*1.5&&o.h>=46;if(sub)sub.style.display=comSub?"":"none";
    g.style.display=livre(x,y+(comSub?6:0),Math.max(wN,comSub?wS:0),comSub?28:15)?"":"none";});
  /* 4) outros rótulos (nomes no mapa geral, rótulos do acesso) */
  const sT=Math.min(0.6*z,1);
  sv.querySelectorAll(".fix:not(.nb):not(.mq):not(.tl):not(.gn)").forEach(g=>{tf(g,uu*Math.max(sT,0.75));g.style.display=sT<0.42?"none":"";});
  /* nomes das fazendas no mapa geral: tamanho fixo, a escolhida primeiro, os que encavalam somem */
  [...sv.querySelectorAll(".gn")].sort((a,b)=>(+b.dataset.sel)-(+a.dataset.sel)).forEach(g=>{tf(g,uu);const [x,y]=tela(g);const w=(+g.dataset.n||8)*7.4+10;
    g.style.display=(livre(x,y,w,18)||g.dataset.sel==="1")?"":"none";});
  sv.querySelectorAll(".mk-pin").forEach(c=>c.setAttribute("r",6*uu));
  desenharGPS();desenharRascunho();escalaHTML();}
function zoom(M,f,cx,cy){const v=vbDe(M);const w=Math.min(Math.max(v.w*f,M.w/60),M.w*2.5),h=w*razao();
  if(cx==null){cx=v.x+v.w/2;cy=v.y+v.h/2;}const kx=(cx-v.x)/v.w,ky=(cy-v.y)/v.h;Object.assign(v,{x:cx-kx*w,y:cy-ky*h,w,h});aplicarVB();}
function centrarEm(M,x,y,w){const v=vbDe(M);if(w){v.w=w;v.h=w*razao();}v.x=x-v.w/2;v.y=y-v.h/2;aplicarVB();}
function escalaHTML(){const el=document.getElementById("escala"),M=mapaAtual(),sv=svgMapa();if(!el||!M||!sv||!temGeo(M))return;
  const mPx=mpu(M)*upx();const alvo=mPx*110;const p=Math.pow(10,Math.floor(Math.log10(alvo)));const n=[1,2,5,10].map(x=>x*p).filter(x=>x<=alvo).pop()||p;
  el.innerHTML=`<i style="width:${Math.round(n/mPx)}px"></i>${fM(n)}`;}
function desenharGPS(){const g=document.getElementById("gps"),M=mapaAtual();if(!g||!M)return;const f=GPS.fix;
  if(!GPS.on||!f||!temGeo(M)){g.innerHTML="";return;}const [x,y]=g2n(M,f.lat,f.lon);const u=upx();const ra=Math.max(f.acc/mpu(M),0);
  g.innerHTML=`<circle class="gps-acc" cx="${x}" cy="${y}" r="${ra}"/><circle class="gps-halo" cx="${x}" cy="${y}" r="${13*u}"/><circle class="gps-dot" cx="${x}" cy="${y}" r="${8*u}"/>`;}
function gpsInfo(M){const f=GPS.fix;if(!GPS.on)return "";if(GPS.erro)return `<span class="bad">${esc(GPS.erro)}</span>`;
  if(!f)return "Procurando o sinal do GPS…";let best=null;
  for(const t of M.trechos||[])for(const p of t.pts){const d=distM([f.lat,f.lon],n2g(M,p[0],p[1]));if(!best||d<best.d)best={d,n:t.n};}
  const [x,y]=g2n(M,f.lat,f.lon);const dentro=x>=0&&y>=0&&x<=M.w&&y<=M.h;
  return `<b>Você está aqui</b> · ±${Math.round(f.acc)} m · ${dentro?(best?`trecho mais perto: <b>T${best.n}</b> a ${fM(best.d)}`:""):`fora deste mapa${best?` · ${fM(best.d)} do trecho T${best.n}`:""}`}`;}
function gpsAtualizar(){desenharGPS();const el=document.getElementById("gps-info"),M=mapaAtual();if(el&&M)el.innerHTML=gpsInfo(M);}
function gpsLigar(){const M=mapaAtual();
  if(!("geolocation" in navigator)){GPS.on=true;GPS.erro="Este navegador não tem GPS disponível.";render();return;}
  GPS.on=true;GPS.seguir=true;GPS.erro="";
  try{GPS.watch=navigator.geolocation.watchPosition(p=>{GPS.erro="";GPS.fix={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy||0,t:Date.now()};
      const M2=mapaAtual();
      if(M2&&temGeo(M2)){const [x,y]=g2n(M2,GPS.fix.lat,GPS.fix.lon);const dentro=x>=0&&y>=0&&x<=M2.w&&y<=M2.h;
        if(GPS.seguir&&dentro){const v=vbDe(M2);centrarEm(M2,x,y,v.w>M2.w*0.6?M2.w*0.4:null);}
        if(MK.trilha&&MK.modo&&MK.modo!=="ponto"&&GPS.fix.acc<=30){const q=[GPS.fix.lat,GPS.fix.lon];const u=MK.pts[MK.pts.length-1];if(!u||distM(u,q)>=5){MK.pts.push(q);desenharRascunho();}}}
      gpsAtualizar();},
    e=>{GPS.erro=e&&e.code===1?"A localização foi bloqueada. Toque no cadeado (ou ícone de ajustes) ao lado do endereço do site › Localização › Permitir, e recarregue.":e&&e.code===3?"O GPS demorou para responder. Vá para céu aberto.":"Não foi possível ler o GPS do aparelho.";gpsAtualizar();},
    {enableHighAccuracy:true,maximumAge:3000,timeout:30000});}catch(e){GPS.erro="O painel não recebeu permissão de localização neste aparelho.";}
  render();}
function gpsDesligar(){try{if(GPS.watch!=null)navigator.geolocation.clearWatch(GPS.watch);}catch(e){}Object.assign(GPS,{on:false,seguir:false,watch:null,fix:null,erro:""});MK.trilha=false;render();}

function mkTxt(tipo,pts){if(tipo==="ponto")return pts.length?fLL(pts[0]):"Toque no mapa";
  if(tipo==="linha")return pts.length<2?"Toque no mapa para marcar o início":`<b>${fM(compM(pts))}</b> · ${pts.length} pontos`;
  return pts.length<3?"Toque no mapa ao redor da área (mín. 3 pontos)":`<b>${fHa(areaM2(pts))}</b> · perímetro ${fM(compM(pts.concat([pts[0]])))}`;}
function desenharRascunho(){const g=document.getElementById("mk-draft"),M=mapaAtual();if(!g||!M)return;
  if(!MK.modo||!temGeo(M)){g.innerHTML="";return;}const u=upx();const P=MK.pts.map(p=>g2n(M,p[0],p[1]));const s=P.map(p=>p.join(",")).join(" ");
  g.innerHTML=(MK.modo==="area"&&P.length>2?`<polygon class="mk-area draft" points="${s}"/>`:"")+(MK.modo!=="ponto"&&P.length>1?`<polyline class="mk-linha draft" points="${s}${MK.modo==="area"&&P.length>2?" "+P[0].join(","):""}"/>`:"")+
    P.map((p,i)=>`<circle class="mk-v${i===P.length-1?" last":""}" cx="${p[0]}" cy="${p[1]}" r="${(i===P.length-1?8:6)*u}"/>`).join("");
  const r=document.getElementById("mk-read");if(r)r.innerHTML=mkTxt(MK.modo,MK.pts)+(MK.trilha?` · <span class="rec">● gravando caminhada</span>`:"");}
function marcasDoMapa(M){return Object.values(DATA.marcas||{}).filter(m=>m.mapa===M.id).sort((a,b)=>String(b.em||"").localeCompare(String(a.em||"")));}
function marcasSVG(M){if(!temGeo(M))return "";return marcasDoMapa(M).map(m=>{const P=(m.pts||[]).map(p=>g2n(M,p[0],p[1]));const s=P.map(p=>p.join(",")).join(" ");const sl=ST.mkSel===m.id?" sel":"";
  if(m.tipo==="ponto"&&P[0])return `<g data-a="mk-sel" data-id="${esc(m.id)}" class="mk-g${sl}"><circle class="mk-pin" cx="${P[0][0]}" cy="${P[0][1]}" r="7"/><circle class="hitp" cx="${P[0][0]}" cy="${P[0][1]}" r="14"/></g>`;

  return `<g data-a="mk-sel" data-id="${esc(m.id)}" class="mk-g${sl}"><polyline class="mk-linha" points="${s}"/><polyline class="hit" points="${s}"/></g>`;}).join("");}
function medidaMarca(m){return m.tipo==="ponto"?fLL(m.pts[0]):m.tipo==="linha"?fM(compM(m.pts)):fHa(areaM2(m.pts))+" · perímetro "+fM(compM(m.pts.concat([m.pts[0]])));}
const TIPO_MK={linha:"Linha",area:"Área",ponto:"Ponto"};

/* gestos: arrastar, pinçar e roda do mouse; toque curto marca ponto quando está medindo */
function ligarMapa(){const sv=svgMapa(),M=mapaAtual();if(!sv||!M)return;aplicarVB();
  sv.addEventListener("pointerdown",e=>{if(e.button>0)return;const P=GEST&&GEST.svg===sv?GEST.P:new Map();P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    GEST={svg:sv,P,vb0:Object.assign({},vbDe(M)),ini:new Map([...P].map(([k,v])=>[k,Object.assign({},v)])),moved:false,multi:P.size>1};arrastou=false;});
  sv.addEventListener("wheel",e=>{e.preventDefault();const [x,y]=pxN(sv,vbDe(M),e.clientX,e.clientY);GPS.seguir=false;zoom(M,e.deltaY>0?1.2:1/1.2,x,y);},{passive:false});
  sv.addEventListener("click",e=>{if(arrastou){e.stopPropagation();e.preventDefault();arrastou=false;}},true);}
window.addEventListener("pointermove",e=>{if(!GEST)return;const sv=svgMapa(),M=mapaAtual();if(!sv||!M||GEST.svg!==sv){GEST=null;return;}
  if(!GEST.P.has(e.pointerId))return;GEST.P.set(e.pointerId,{x:e.clientX,y:e.clientY});const v=vbDe(M),r=sv.getBoundingClientRect(),v0=GEST.vb0;

  if(ps.length===1){const dx=ps[0].x-is[0].x,dy=ps[0].y-is[0].y;if(!GEST.moved&&Math.hypot(dx,dy)<7)return;GEST.moved=true;GPS.seguir=false;
    v.x=v0.x-dx*v0.w/r.width;v.y=v0.y-dy*v0.h/r.height;aplicarVB();}
  else if(ps.length>=2&&is[1]){GEST.moved=true;GEST.multi=true;GPS.seguir=false;const d0=Math.hypot(is[0].x-is[1].x,is[0].y-is[1].y)||1,d1=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y)||1;
    const m0={x:(is[0].x+is[1].x)/2,y:(is[0].y+is[1].y)/2},m1={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2};
    const n0p=[v0.x+(m0.x-r.left)*v0.w/r.width,v0.y+(m0.y-r.top)*v0.h/r.height];
    const w=Math.min(Math.max(v0.w*d0/d1,M.w/60),M.w*2.5),h=w*razao();Object.assign(v,{w,h,x:n0p[0]-(m1.x-r.left)*w/r.width,y:n0p[1]-(m1.y-r.top)*h/r.height});aplicarVB();}
  e.preventDefault();},{passive:false});
function fimGesto(e){if(!GEST||!GEST.P.has(e.pointerId))return;const sv=svgMapa(),M=mapaAtual();const g=GEST;g.P.delete(e.pointerId);
  if(g.moved||g.multi)arrastou=true;
  if(!g.moved&&!g.multi&&e.type==="pointerup"&&MK.modo&&sv&&M&&temGeo(M)){const [x,y]=pxN(sv,vbDe(M),e.clientX,e.clientY);const ll=n2g(M,x,y);
    if(MK.modo==="ponto")MK.pts=[ll];else MK.pts.push(ll);arrastou=true;desenharRascunho();}
  if(!g.P.size)GEST=null;else{g.vb0=Object.assign({},vbDe(M));g.ini=new Map([...g.P].map(([k,v])=>[k,Object.assign({},v)]));}}

function dadosOffline(cod){const r1=v=>Math.round(v*10)/10;const pt=p=>[r1(p[0]),r1(p[1])];
  return Object.values(DATA.mapas).filter(m=>(m.codigo||m.id)===cod&&temGeo(m)).sort((a,b)=>(!!a.acesso)-(!!b.acesso)).map(M=>{const R=progressoMapa(M);return {
    nome:M.nome||"",mapa:M.acesso?"Acesso":"Estradas internas",acesso:!!M.acesso,w:M.w,h:M.h,geo:M.geo,
    talhoes:(M.talhoes||[]).map(t=>({id:t.id||"",ha:n0(t.ha),vol:n0(t.vol),pts:t.pts.map(pt),lab:t.lab?pt(t.lab):null})),
    trechos:(M.trechos||[]).map(t=>{const ps=partesEf(M,t);const st=piorSt(ps)||("g-"+estadoGeral(R[t.n]||{s:{}}).c);return {n:t.n,tipo:t.tipo||"",m:n0(t.m),pts:t.pts.map(pt),mid:t.mid?pt(t.mid):null,st,partes:ps.length>1?ps.map(p=>kmF(p.km)+" km "+nomeSt(p.st)):[]};})};});}
function situacaoApp(){const out={};for(const M of Object.values(DATA.mapas)){if(!temGeo(M))continue;const cod=M.codigo||M.id;const R=progressoMapa(M);const o={};
  (M.trechos||[]).forEach(t=>{const ps=partesEf(M,t);const st=piorSt(ps)||("g-"+estadoGeral(R[t.n]||{s:{}}).c);o[t.n]=ps.length>1?[st,ps.map(p=>kmF(p.km)+" km "+nomeSt(p.st))]:[st];});
  (out[cod]=out[cod]||{})[M.acesso?"A":"I"]=o;}return out;}
let SIT_T=null;function agendarSituacao(){clearTimeout(SIT_T);SIT_T=setTimeout(async()=>{try{if(!NUVEM||!navigator.onLine||!DATA||!DATA.mapas)return;const m=situacaoApp();if(!Object.keys(m).length)return;
  const ant=DATA.config&&DATA.config.situacao_app;if(ant&&JSON.stringify(ant.mapas)===JSON.stringify(m))return;
  const doc={em:new Date().toISOString(),por:quem(),mapas:m};await DB.doc("config/situacao_app").set(clone(doc));DATA.config.situacao_app=doc;}catch(e){}},6000);}
function OFF_VIEWER(){
  const D=window.__MAPAS__;const $=s=>document.querySelector(s);const fmt=v=>(isFinite(v)?v:0).toLocaleString("pt-BR",{maximumFractionDigits:2});
  const ST_N={pronto:"Trecho pronto",agulhado:"Agulhado",preparo:"Preparo feito",falta:"Falta preparo",nc:"Não conferido","g-zero":"Não iniciado","g-and":"Em andamento","g-ok":"Concluído","g-np":"Não previsto","g-fora":"Não previsto"};
  let I=0,VB=null,sel=null,GPS={on:false,fix:null,watch:null,erro:""};
  const n2g=(M,x,y)=>{const c=M.geo;const px=c.x0+(x-c.n0)*c.s,py=c.y0+(y-c.n0)*c.s,yu=c.H-py,b=c.bb;const u=(px-b[0])/(b[2]-b[0]),v=(yu-b[1])/(b[3]-b[1]);const [BL,TL,TR,BR]=c.g;const f=i=>(1-u)*(1-v)*BL[i]+(1-u)*v*TL[i]+u*v*TR[i]+u*(1-v)*BR[i];return [f(0),f(1)];};
  const g2n=(M,lat,lon)=>{let x=M.w/2,y=M.h/2;for(let i=0;i<6;i++){const p=n2g(M,x,y),px=n2g(M,x+1,y),py=n2g(M,x,y+1);const a=px[0]-p[0],b=py[0]-p[0],c=px[1]-p[1],d=py[1]-p[1],det=a*d-b*c;if(!det)break;const e0=lat-p[0],e1=lon-p[1];x+=(d*e0-b*e1)/det;y+=(-c*e0+a*e1)/det;}return [x,y];};
  const dist=(a,b)=>{const R=6371008.8,r=Math.PI/180;const p1=a[0]*r,p2=b[0]*r,dp=p2-p1,dl=(b[1]-a[1])*r;return 2*R*Math.asin(Math.sqrt(Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2));};
  const fM=m=>m>=1000?fmt(Math.round(m/10)/100)+" km":fmt(Math.round(m))+" m";
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const M=()=>D[I];const sv=()=>$("svg");
  const raz=()=>{const r=sv().getBoundingClientRect();return r.width&&r.height?r.height/r.width:1;};
  const inteiro=()=>{const m=M(),r=raz();if(!m._bb){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const ad=p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);};m.trechos.forEach(t=>t.pts.forEach(ad));m.talhoes.forEach(t=>t.pts.forEach(ad));const g=Math.max(x1-x0,y1-y0)*0.04;m._bb=x1>x0?{x:x0-g,y:y0-g,w:x1-x0+2*g,h:y1-y0+2*g}:{x:0,y:0,w:m.w,h:m.h};}const b=m._bb;let w,h;if(b.h/b.w>r){h=b.h;w=h/r;}else{w=b.w;h=w*r;}return {x:b.x+b.w/2-w/2,y:b.y+b.h/2-h/2,w,h};};
  const mpu=m=>dist(n2g(m,0,m.h/2),n2g(m,100,m.h/2))/100;
  function desenhar(){const m=M();VB=null;sel=null;
    $("#tabs").innerHTML=D.length>2?`<select id="selm" aria-label="Fazenda">${D.map((x,i)=>`<option value="${i}" ${i===I?"selected":""}>${esc(x.nome)} · ${x.acesso?"Acesso":"Internas"}</option>`).join("")}</select>`:D.length>1?D.map((x,i)=>`<button data-i="${i}" class="${i===I?"on":""}">${esc(x.mapa)}</button>`).join(""):"";

/* No mapa de acesso desenha as estradas internas da fazenda; no interno, o acesso chegando. Só referência (linha fina), sem toque. */
const VIZ={};
function camadaVizinha(M){if(!temGeo(M))return "";const id=M.acesso?String(M.id).replace(/-acesso$/,""):M.id+"-acesso";const O=DATA.mapas[id];if(!O||!temGeo(O))return "";
  const k=M.id+"|"+(O.em||"")+"|"+(M.em||"");if(VIZ[M.id]&&VIZ[M.id].k===k)return VIZ[M.id].h;
  const R=progressoMapa(O);const h=(O.trechos||[]).map(t=>{const pp=t.pts.map(q=>{const g=n2g(O,q[0],q[1]);const p=g2n(M,g[0],g[1]);return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ");
    let c="np";try{c=estadoGeral(R[t.n]).c;}catch(e){}return `<polyline class="viz ${c}" points="${pp}"><title>${esc(O.nome)} ${O.acesso?"acesso ":""}T${t.n}</title></polyline>`;}).join("");
  VIZ[M.id]={k,h};return h;}
function marcos(M){const vis=new Set(),out=[];for(const t of M.trechos||[])for(const q of [t.pts[0],t.pts[t.pts.length-1]]){const k=Math.round(q[0])+","+Math.round(q[1]);if(!vis.has(k)){vis.add(k);out.push(q);}}return out;}
const xmlE=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KCOR={zero:"ff838be5",and:"ff00a1e0",ok:"ff578b2e",np:"ffa6ada9",fora:"ffa85f1e",zero2:"ff3d46b5",and2:"ff006b9c",ok2:"ff335c14",np2:"ff6b726e",fora2:"ffa85f1e"};
function kmlDoMapa(M){const R=progressoMapa(M);const k=ST.serv&&ST.serv!=="tudo"&&SERV[ST.serv]?ST.serv:"tudo";const cc=p=>p[1].toFixed(7)+","+p[0].toFixed(7)+",0";
  const est=Object.keys(KCOR).map(c=>`<Style id="t_${c}"><LineStyle><color>${KCOR[c]}</color><width>5</width></LineStyle></Style>`).join("")+
    `<Style id="mk_l"><LineStyle><color>ffb53f7b</color><width>3</width></LineStyle></Style><Style id="mk_a"><LineStyle><color>ffb53f7b</color><width>2</width></LineStyle><PolyStyle><color>55b53f7b</color></PolyStyle></Style><Style id="mk_p"><IconStyle><color>ffb53f7b</color></IconStyle></Style>`;
  const tr=(M.trechos||[]).map(t=>{const e=estadoK(R[t.n],k);const pts=t.pts.map(q=>n2g(M,q[0],q[1]));
    return `<Placemark><name>T${t.n}${M.acesso?" (acesso)":""}</name><description>${xmlE(`${t.tipo||""} · ${fmt(t.m)} m · ${nomeServ(k)}: ${ST_MAPA[e.c]}${e.prev?" "+Math.round(e.p*100)+"% ("+fmt(e.feito)+" de "+fmt(e.prev)+" m)":""}`)}</description><styleUrl>#t_${e.c}${t.n%2?"":"2"}</styleUrl><LineString><tessellate>1</tessellate><coordinates>${pts.map(cc).join(" ")}</coordinates></LineString></Placemark>`;}).join("");
  const mks=marcasDoMapa(M).map(m=>{const nm=xmlE((TIPO_MK[m.tipo]||"")+(m.nome?": "+m.nome:""));const ds=xmlE(medidaMarca(m)+" · "+quemNome(m.por)+" · "+fDH(m.em));
    if(m.tipo==="ponto")return `<Placemark><name>${nm}</name><description>${ds}</description><styleUrl>#mk_p</styleUrl><Point><coordinates>${cc(m.pts[0])}</coordinates></Point></Placemark>`;
    if(m.tipo==="area")return `<Placemark><name>${nm}</name><description>${ds}</description><styleUrl>#mk_a</styleUrl><Polygon><outerBoundaryIs><LinearRing><coordinates>${m.pts.concat([m.pts[0]]).map(cc).join(" ")}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`;
    return `<Placemark><name>${nm}</name><description>${ds}</description><styleUrl>#mk_l</styleUrl><LineString><tessellate>1</tessellate><coordinates>${m.pts.map(cc).join(" ")}</coordinates></LineString></Placemark>`;}).join("");
  const tal=(M.talhoes||[]).filter(t=>t.id).map(t=>`<Placemark><name>Talhão ${xmlE(t.id)}</name><description>${xmlE(fmt(t.ha)+" ha"+(t.vol?" · "+fmt(t.vol)+" m³":""))}</description><Style><LineStyle><color>ff8ab9c9</color><width>1.5</width></LineStyle><PolyStyle><color>33c6ebf7</color></PolyStyle></Style><Polygon><outerBoundaryIs><LinearRing><coordinates>${t.pts.concat([t.pts[0]]).map(q=>cc(n2g(M,q[0],q[1]))).join(" ")}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`).join("");

const STT_K=["pronto","agulhado","preparo","falta"];
const STT_DESC={pronto:"serviço final conferido e acabado",agulhado:"brita lançada, falta espalhar e compactar",preparo:"leito preparado (onde vai brita, ainda espera a brita)",falta:"falta o preparo do leito"};
const STT_COR={pronto:"var(--m-ok)",agulhado:"var(--m-and)",preparo:"var(--m-prep)",falta:"var(--m-zero)",nc:"var(--m-np)"};
const nomeSt=k=>k==="nc"||!k?"Não conferido":STT[k].t;

const tcId=(M,n)=>M.id+"__"+n;
function tcDe(M,n){return (DATA.trechos||{})[tcId(M,n)]||null;}

function comumDe(t){if(!t||!t.comum)return null;const i=String(t.comum).lastIndexOf(":");const M2=DATA.mapas[t.comum.slice(0,i)];const t2=M2&&(M2.trechos||[]).find(x=>x.n===+t.comum.slice(i+1));return t2?{M:M2,t:t2}:null;}
function partesTr(M,t,prof){const d=tcDe(M,t.n);const km=kmTr(t,d);
  if(!d||!(d.partes||[]).length){const c=(prof||0)<4&&comumDe(t);if(c){const ps=partesTr(c.M,c.t,(prof||0)+1);const tot=ps.reduce((a,p)=>a+p.km,0)||1;if(ps.some(p=>p.st))return ps.map(p=>({km:Math.round(km*p.km/tot*100)/100,st:p.st,comum:true}));}

  for(const t of M.trechos||[]){if(semComum&&t.comum&&comumDe(t))continue;const d=tcDe(M,t.n);const tipo=tipoTr(M,t,d);R.n++;if(d&&(d.partes||[]).length){R.nConf++;if(String(d.em||"")>R.ult)R.ult=d.em;}
    const ps=partesTr(M,t);const pe=partesEf(M,t);R.trs.push({t,d,tipo,ps});
    for(const p of pe){const k=p.st||"nc";const T=R.tipos[tipo]||(R.tipos[tipo]={});T[k]=(T[k]||0)+p.km;R.tot[k]=(R.tot[k]||0)+p.km;R.total+=p.km;(R.porSt[k]=R.porSt[k]||new Set()).add(t.n);
      if((p.st==="preparo"||p.st==="falta")&&finalDe(M,t)==="cascalho")R.brita+=p.km*1000*largTr(t)*BRITA.esp;}}

/* ================= PRODUÇÃO DO MÊS ================= */
function nomeMes(m){const [a,b]=m.split("-");return ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"][+b-1]+"/"+a;}
function prodAgrupa(arr){const m={};arr.forEach(x=>{const k=chaveRdo(x.l);const r=m[k]||(m[k]={nome:nomeDe(x.l),un:unDe(x.l),inf:0,val:0,pend:0,nao:0,n:0,eps:new Set()});
  r.inf+=x.q;r.n++;if(x.lc.eps)r.eps.add(x.lc.eps);if(x.st==="ok"||x.st==="parcial")r.val+=x.qv;else if(x.st==="pend"||x.st==="refazer")r.pend+=x.q;else r.nao+=x.q;});
  return Object.values(m).sort((a,b)=>a.nome.localeCompare(b.nome));}
function prodDados(){const mes=ST.mes||hoje().slice(0,7);const pf=ST.pfaz||"";

  const TR=[];for(const d of Object.values(DATA.trechos||{})){if((d.data||"").slice(0,7)!==mes||!(d.partes||[]).length)continue;const M=DATA.mapas[d.mapa];if(!M)continue;
    if(pf&&!(fk(pf).includes(fk(M.nome))))continue;for(const p of d.partes)TR.push({faz:M.nome+(M.acesso?" (acesso)":""),st:p.st,km:n0(p.km)});}
  return {mes,pf,L,porFaz,H,TR};}
function prodTab(rows){return `<div class="tbwrap"><table class="tb"><thead><tr><th>Atividade</th><th>Un</th><th class="n">Lançamentos</th><th class="n">Informado</th><th class="n">Conferido</th><th class="n">A conferir</th><th class="n">Não confere</th></tr></thead><tbody>

const GERAL={M:null,chave:""};
function montarGeral(){const ms=mapasOrd().filter(temGeo);const chave=ms.map(m=>m.id+":"+(m.em||"")).join("|");if(GERAL.M&&GERAL.chave===chave)return GERAL.M;
  if(!ms.length){GERAL.M=null;return null;}
  const LL=ms.map(M=>({M,tr:(M.trechos||[]).map(t=>({t,ll:t.pts.map(p=>n2g(M,p[0],p[1]))})),tal:(M.acesso?[]:(M.talhoes||[])).filter(t=>t.pts&&t.pts.length>2).map(t=>({t,ll:t.pts.map(p=>n2g(M,p[0],p[1]))}))}));
  let a0=90,a1=-90,o0=180,o1=-180;LL.forEach(x=>[...x.tr,...x.tal].forEach(f=>f.ll.forEach(([a,o])=>{a0=Math.min(a0,a);a1=Math.max(a1,a);o0=Math.min(o0,o);o1=Math.max(o1,o);})));
  const cs=Math.cos((a0+a1)/2*Math.PI/180);const K=1000/Math.max((o1-o0)*cs,(a1-a0),1e-6);const pad=30;
  const P=([a,o])=>[+((o-o0)*cs*K+pad).toFixed(1),+((a1-a)*K+pad).toFixed(1)];
  const W=(o1-o0)*cs*K+pad*2,H=(a1-a0)*K+pad*2;const farms={};const trechos=[],talhoes=[];
  for(const x of LL){const cod=x.M.codigo||x.M.id;const F=farms[cod]||(farms[cod]={cod,nome:x.M.nome,b:[1e9,1e9,-1e9,-1e9],bi:null});
    for(const f of x.tr){const pts=f.ll.map(P);trechos.push({mapa:x.M.id,cod,n:f.t.n,pts,M:x.M,t:f.t});pts.forEach(([X,Y])=>{F.b=[Math.min(F.b[0],X),Math.min(F.b[1],Y),Math.max(F.b[2],X),Math.max(F.b[3],Y)];});}
    for(const f of x.tal){const pts=f.ll.map(P);talhoes.push({cod,pts});let b=F.bi||[1e9,1e9,-1e9,-1e9];pts.forEach(([X,Y])=>{b=[Math.min(b[0],X),Math.min(b[1],Y),Math.max(b[2],X),Math.max(b[3],Y)];});F.bi=b;}}
  GERAL.M={id:"__geral",nome:"Mapa geral",w:W,h:H,trechos:[],talhoes:[],farms:Object.values(farms),tr:trechos,tal:talhoes};GERAL.chave=chave;return GERAL.M;}

  const b=F.bi||F.b;const w=Math.max(b[2]-b[0],(b[3]-b[1])/razao())*1.25+20;centrarEm(M,(b[0]+b[2])/2,(b[1]+b[3])/2,w);}

    ${M.farms.map(f=>{const b=f.bi||f.b;const cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;return `<g class="fix gn${gf&&f.cod!==gf?" gfora":""}" data-cx="${cx}" data-cy="${cy}" data-n="${String(f.nome).length}" data-sel="${gf&&f.cod===gf?1:0}"><text class="gnome" x="${cx}" y="${cy}">${esc(f.nome)}</text></g>`;}).join("")}

/* ---------- formulário de atividade (levantamento ou linha) ---------- */
function novoItem(ref){
  const it={id:uid("i"),cod:null,fam:null,nome:"",un:"",c:"",l:"",e:"",u:"",dmt:"",direto:"",talhao:"",trecho:"",obs:"",fotos:[],ord:Date.now()};

  return it;
}
function finLanc(lc){return lc?(lc.fin||finDaFazenda(lc.fazenda)):"";}
function finDaTela(s){if(s.osId&&DATA.os[s.osId])return DATA.os[s.osId].finalidade;if(s.lcId&&DATA.lanc[s.lcId])return finLanc(DATA.lanc[s.lcId]);return "";}
function finBusca(s){if(s.modo==="os"||s.modo==="pk"){const o=DATA.os[ST.osId];return o?o.finalidade:"";}if(s.modo==="rev")return REV?REV.fin||"":"";if(s.modo==="lanc")return finLanc(DATA.lanc[s.lcId]);return "";}
const NOME_ESC={abastecimento:{15:"Construção de camalhão - nível 1 (secundária)",16:"Construção de camalhão - nível 2 (primária)",80:"Recuperação de áreas de empréstimo – nível 1"}};
function refHTML(it,fin){const r=refDe(it);if(!r)return "";
  if(fin==="implantacao"||fin==="abastecimento")return `<div class="ref"><b>Padrão ${FIN[fin]}:</b> ${esc(fin==="implantacao"?r.I:r.A)}</div>`;

function dimsHTML(it,pfx){

  ${s.kind==="item"&&usaBrita(it)?`<div id="brita-box">${britaHTML(it,"data-d",britaEst(it),!(it.cod===35||it.cod===24||it.cod===25||it.fam==="TB"))}</div>`:""}
  ${s.novo?`<div id="deps-box">${depsHTML(it)}</div>`:""}

function atualizarCalc(){

/* Quem executa a atividade-fim depende destas antes. Base: escopos de Implantação e Abastecimento. */
const DEPS={
  PLS:[["cod:30","Escavação e carregamento"],["fam:TS","Transporte de solos"]],
  35:[["fam:TB","Transporte de brita"]],
  24:[["fam:TB","Transporte de brita (revestimento do ponto de módulo)"]],
  25:[["fam:TB","Transporte de brita (revestimento do ponto de módulo)"]],
  79:[["cod:30","Escavação e carregamento"],["fam:TS","Transporte de solos"],["av:Bota-fora","Bota-fora de material"]],
  21:[["cod:30","Escavação e carregamento"],["fam:TS","Transporte de solos"]],
  16:[["cod:30","Escavação e carregamento"],["fam:TS","Transporte de solos"]],
  37:[["cod:22","Compactação de base"]]
};
function depsDe(it){
  if(it.fam==="PLS")return DEPS.PLS;if(it.fam)return [];
  if(it.cod)return DEPS[it.cod]||[];
  const n=norm(it.nome||"");
  if(/transporte/.test(n))return [];
  if(/tubo|bueiro|manilha/.test(n))return [["av:Transporte do tubo","Transporte do tubo"]];
  if(/mata.?burro/.test(n))return [["av:Transporte do mata-burro","Transporte do mata-burro"]];
  if(/brita|pedra/.test(n))return [["fam:TB","Transporte de brita"]];
  if(/aterro/.test(n))return [["fam:TS","Transporte de solos"],["av:Bota-fora","Bota-fora de material"]];
  return [];
}
function depsHTML(it){const D=depsDe(it);if(!D.length)return "";it.deps=it.deps||{};
  const b=(k,v,t)=>`<button data-a="dep" data-k="${esc(k)}" data-v="${v}" aria-pressed="${it.deps[k]===v}">${t}</button>`;
  return `<div class="member" style="border-color:var(--warn)"><b>Atividades anteriores</b><div class="muted small">Para “${esc(nomeDe(it))}” normalmente vem junto:</div>
  ${D.map(([k,n])=>`<div class="stack tight"><div><b>${esc(n)}</b>${k.startsWith("av:")?` <span class="st warn">fora do escopo</span>`:""}</div><div class="seg">${b(k,"lancar","Lançar também")}${b(k,"feita","Já foi feita")}${b(k,"na","Não precisa")}</div></div>`).join("")}
  <div class="muted small">“Lançar também” cria a atividade com as mesmas medidas, talhão e trecho. Confira depois.</div></div>`;}
function depsPendentes(it){const D=depsDe(it);const a=it.deps||{};return D.filter(([k])=>!a[k]).length;}
function itensDasDeps(it){const out=[];const a=it.deps||{};
  for(const [k,n] of depsDe(it)){if(a[k]!=="lancar")continue;
    const ref=refDePick(k);const x=novoItem(ref);if(ref.nome)x.nome=n;
    if(tipoUn(unDe(x))==="volume"){x.c=it.c;x.l=it.l;x.e=it.e;x.eUn=it.eUn||eUnDe(it);if(x.fam==="TS"||x.fam==="TB")x.dmt=it.dmt||"";}
    else if(tipoUn(unDe(x))==="area"){x.c=it.c;x.l=it.l;}
    x.talhao=it.talhao;x.trecho=it.trecho;x.obs="junto com "+nomeDe(it);x.ord=Date.now()+out.length+1;out.push(x);}
  return out;}

/* ---------- pedido de brita: quantidade e ponto de descarga da carreta ---------- */
function usaBrita(it){if(it.pac)return false;if(it.cod===35||it.cod===24||it.cod===25||it.fam==="TB")return true;return foraEscopo(it)&&/brita|pedra/.test(norm(it.nome||""));}
function pkUsaBrita(d){const t=d.pac&&d.pac.tipo;return t==="brita"||t==="aterro";}
function britaEst(it){ // m³ de brita a pedir
  if(it.cod===24)return 23*43*0.05*n0(it.u);if(it.cod===25)return 23*73*0.05*n0(it.u);
  if(it.cod===35||it.fam==="TB")return qtdDe(it);
  return n0(it.britaQ);}
function britaPkEst(d){if(d.pac.tipo==="brita")return n0(d.c)*n0(d.l)*n0(d.e)/100;return n0(d.britaQ);}
function britaHTML(d,attr,est,manual){
  const tb=(v,t)=>`<button data-a="pd-tombo" data-v="${v}" aria-pressed="${d.pdTombo===v}">${t}</button>`;
  return `<div class="member" style="border-color:var(--accent)"><b>Pedido de brita</b>
  ${manual?`<label class="f">Brita necessária (m³)<input class="inp num" inputmode="decimal" id="pd-q" ${attr}="britaQ" value="${esc(d.britaQ||"")}" placeholder="Ex.: medida do aterro × espessura"></label>`
    :`<div class="calc" style="padding:8px 12px">Brita necessária ≈ <span class="num" id="pd-est">${fmt(est)}</span> m³</div>`}
  <label class="f">Ponto de descarga da carreta (coordenada ou link do mapa)<input class="inp" id="pd-ponto" ${attr}="pd" value="${esc(d.pd||"")}" placeholder="-19.7246, -51.9312"></label>
  <div class="muted small">No Google Maps, segure o dedo no local da descarga, copie a coordenada e cole aqui.</div>
  <div class="lbl">Caminhão grande chega até o local de uso?</div>
  <div class="seg">${tb("chega","Sim, descarrega no local")}${tb("tombo","Não, precisa de tombo")}</div>
  ${d.pdTombo==="tombo"?`<label class="f">Distância do ponto de descarga até o uso (km)<input class="inp num" inputmode="decimal" id="pd-dist" ${attr}="pdDist" value="${esc(d.pdDist||"")}"></label>
  <label class="f">O que falta para o caminhão grande chegar (adequação)<input class="inp" id="pd-adeq" ${attr}="pdAdeq" value="${esc(d.pdAdeq||"")}" placeholder="Ex.: curva fechada, ponte fraca, atoleiro"></label>`:""}
  </div>`;}
function britaResumo(its){const m={};
  for(const it of its){const q=n0(it.britaM3);if(!q)continue;const k=(it.pd||"Sem ponto de descarga").trim();
    const r=m[k]||(m[k]={pd:k,q:0,tombo:false,dist:0,n:0});r.q+=q;r.n++;if(it.pdTombo==="tombo"){r.tombo=true;r.dist=Math.max(r.dist,n0(it.pdDist));}}
  return Object.values(m);}

const FOTOCACHE={};
function hidratarFotos(root){
  root.querySelectorAll("img[data-fref]").forEach(img=>{const r=img.dataset.fref;if(img.dataset.ok)return;
    if(r.startsWith("a:")){img.src="/_blob/"+r.slice(2);img.dataset.ok=1;}
    else if(r.startsWith("f:")){if(FOTOCACHE[r]){img.src=FOTOCACHE[r];img.dataset.ok=1;return;}
      DB.doc("fotos/"+r.slice(2)).get().then(s=>{const d=s.exists&&s.data();if(d&&d.d){FOTOCACHE[r]=d.d;document.querySelectorAll(`img[data-fref="${r}"]`).forEach(i=>{i.src=d.d;i.dataset.ok=1;});}}).catch(()=>{});}
  });
}
function reduzir(file,M,qual){return new Promise((ok,erro)=>{const fr=new FileReader();fr.onerror=()=>erro(new Error("leitura"));
  fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,M/Math.max(img.width,img.height));
    const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);ok(cv);};img.onerror=()=>erro(new Error("imagem"));img.src=fr.result;};fr.readAsDataURL(file);});}
async function guardarFoto(file){
  if(ASSETS){try{const cv=await reduzir(file,1600,.78);const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.78));
    const up=await ASSETS.upload(blob,{type:"image/jpeg"});return "a:"+up.id;}catch(e){/* cai para o banco */}}
  const cv=await reduzir(file,1024,.62);const d=cv.toDataURL("image/jpeg",.62);
  const ref=DB.collection("fotos").doc();await ref.set({d,em:new Date().toISOString()});FOTOCACHE["f:"+ref.id]=d;return "f:"+ref.id;
}
async function receberFotos(el){
  const s=topo();if(!s)return;const d=s.kind==="pk"||s.kind==="item"||s.kind==="linha"||s.kind==="revlinha"||s.kind==="val"||s.kind==="valg"?s.d:null;if(!d)return;
  const files=Array.from(el.files||[]);el.value="";if(!files.length){toast("Nenhuma foto recebida.");return;}
  d.fotos=d.fotos||[];const vagas=MAXF-d.fotos.length;d._subindo=true;refazFotos();
  for(const f of files.slice(0,vagas)){try{d.fotos.push(await guardarFoto(f));}catch(e){toast("Não consegui guardar uma das fotos.");}}
  d._subindo=false;if(files.length>vagas)toast(`Só cabem ${MAXF} fotos.`);refazFotos();
}
function refazFotos(){const b=document.getElementById("fotos-box");const s=topo();if(b&&s&&s.d){b.innerHTML=fotosHTML(s.d);hidratarFotos(b);}}

- "EQUIPAMENTOS POR HORA COMBINADA": uma linha de hora por frota com horímetro preenchido (cod pelo prefixo da frota); a atividade descrita vai em obs.
- Blocos de modelo em branco (só títulos e campos vazios) e listas "EQUIPAMENTOS DA FRENTE" não geram linha.
- Linhas "OBSERVAÇÃO" com medida mas sem atividade clara (ex.: "Argilamento da saída da rodovia 15 × 19,2") → cod null, nome como está, c e l, duvida "atividade e espessura não informadas".
- "Impactos improdutivos", "Equipamentos em manutenção", "Fazenda Finalizada", datas de início e entrega → "obs" do apontamento, curto.

- Use o cod do catálogo mais próximo. Se não houver atividade equivalente, cod null e "nome" como está na mensagem.
- Não invente números. "qtd" só para unidades, horas ou km, ou quando a mensagem der só o total. Com medidas, preencha c (m), l (m), e (cm; para aterro e jazida, altura em m) e deixe qtd null.

- "trecho_msg": o pedaço da mensagem que gerou a linha (curto, até 120 caracteres).

      it.txt=x.trecho_msg?String(x.trecho_msg):"";it.duvida=x.duvida?String(x.duvida):"";

function acharNoCatalogo(txt){
  const t=norm(txt).replace(/\s+/g," ");let best=null,bl=0;
  for(const it of Object.values(C)){const n=norm(it.nome).replace(/\s+/g," ");if(t.includes(n)&&n.length>bl){best=it;bl=n.length;}}
  if(best)return best.cod;
  const tok=s=>norm(s).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2);
  const tw=new Set(tok(txt));let bs=0;
  for(const it of Object.values(C)){const nw=tok(it.nome);if(!nw.length)continue;const hit=nw.filter(w=>tw.has(w)).length/nw.length;if(hit>bs){bs=hit;best=it;}}
  return bs>=0.75?best.cod:null;
}
function lerRDO(txt){
  const out=[];
  for(const raw of txt.split(/\r?\n/)){const s=raw.trim();if(!s)continue;
    const cells=s.split(/\t|;|\s{2,}/).map(x=>x.trim()).filter(Boolean);
    const numIdx=cells.map((c,i)=>/^[\d.,]+$/.test(c)&&isFinite(pn(c))?i:-1).filter(i=>i>=0);
    if(!numIdx.length)continue;
    const qi=numIdx[numIdx.length-1];const q=pn(cells[qi]);
    let cod=null;const c0=cells[0];
    if(numIdx[0]===0&&qi!==0&&/^\d{1,3}$/.test(c0)&&C[+c0])cod=+c0;
    const texto=cells.filter((c,i)=>!numIdx.includes(i)).join(" ");
    if(!cod&&texto)cod=acharNoCatalogo(texto);
    if(!cod&&!texto)continue;
    const it=cod?itemDeCod(cod):novoItem({nome:texto,un:"un"});
    it.q=String(q).replace(".",",");it.src=s.slice(0,120);out.push(it);
  }
  return out;
}

function nfLixo(n){const b=n.split("/").pop();return !b||b.startsWith(".")||b.startsWith("~$")||/^(thumbs\.db|desktop\.ini)$/i.test(b)||n.includes("__MACOSX/");}
function nfTipoArq(n){const b=norm(n.split("/").pop());
  if(/\.(shp|shx|dbf|prj|cpg|sbn|sbx)$/.test(b)||/shape/.test(b))return "shapes";

function nfNomeArqs(arqs,cod){const a=arqs.find(x=>/\.pdf$/i.test(x.caminho));if(!a)return "Fazenda nova";
  let b=a.caminho.split("/").pop().replace(/\.pdf$/i,"");if(cod)b=b.replace(cod,"");b=b.split("_")[0].replace(/^[\s\-]+|[\s\-]+$/g,"").replace(/\s+/g," ");return b||"Fazenda nova";}
/* agrupa os arquivos (caminho relativo) em fazendas: subpastas com PDF e códigos diferentes = fazendas diferentes */
function nfAgrupar(arqs,origem){
  const temPdf=L=>L.some(a=>/\.pdf$/i.test(a.caminho));
  const P=a=>a.caminho.split("/").filter(Boolean);
  const r0=new Set(arqs.map(a=>P(a).length>1?P(a)[0]:""));const pref=r0.size===1&&!r0.has("")?[...r0][0]:"";
  const lv=pref?1:0;const g={},soltos=[];
  arqs.forEach(a=>{const p=P(a);if(p.length>lv+1)(g[p[lv]]=g[p[lv]]||[]).push(a);else soltos.push(a);});
  const comPdf=Object.entries(g).filter(([,L])=>temPdf(L));
  if(comPdf.length>=2&&!temPdf(soltos)){const cods=comPdf.map(([k,L])=>nfCodigo([k,...L.map(a=>a.caminho)]));
    if(new Set(cods).size===cods.length)return comPdf.map(([k,L])=>({pasta:k,arqs:L}));}
  return [{pasta:pref||origem||"Fazenda nova",arqs}];}
async function nfAbrirZip(blob,pref,out,fora){let Z;try{Z=await carregarZip();}catch(e){fora.push("zip (sem internet)");return;}

    if(/\.zip$/i.test(e.name)&&!/shape/i.test(e.name))await nfAbrirZip(b,c.replace(/\.zip$/i,""),out,fora);
    else out.push({caminho:c,blob:b,bytes:b.size});}}
async function nfLerArquivos(files,pastas){

      const ja=d.faz.find(x=>x.pasta===f.pasta);if(ja){const vist=new Set(ja.arqs.map(a=>a.caminho));f.arqs.forEach(a=>{if(!vist.has(a.caminho))ja.arqs.push(a);});continue;}

      if(nfLixo(rel))continue;

      else if(zip){const L=[];await nfAbrirZip(f,"",L,fora);juntar(f.name.replace(/\.zip$/i,""),L);}
      else soltos.push({caminho:f.name,blob:f,bytes:f.size});}
    for(const k in porPasta)juntar(k,porPasta[k]);

async function nfSubir(a){
  const ext=(a.caminho.split(".").pop()||"").toLowerCase();
  if(NF_IMG[ext]){if(a.bytes>20*1048576)throw {code:"too_large"};const r=await ASSETS.upload(a.blob,{type:NF_IMG[ext]});return {asset:r.id,tipo:NF_IMG[ext],b64:false};}
  if(a.bytes>15*1048576)throw {code:"too_large"};
  const b=await b64De(a.blob);const r=await ASSETS.upload(new Blob([b],{type:"text/plain"}),{type:"text/plain"});return {asset:r.id,tipo:"text/plain",b64:true};}
async function nfEnviar(s){const d=s.d;if(!ASSETS){toast("Sua conta precisa de acesso de Editor para enviar arquivos.");return;}

    for(let i=0;i<f.arqs.length;i++){const a=f.arqs[i];d.env=`Fazenda ${fi+1} de ${d.faz.length} (${f.nome}): arquivo ${i+1} de ${f.arqs.length}…`;refazCorpo();
      let tent=0;for(;;){try{const r=await nfSubir(a);arquivos.push(Object.assign({nome:a.caminho.split("/").pop(),caminho:a.caminho,bytes:a.bytes,cat:nfTipoArq(a.caminho)},r));break;}
        catch(e){const c=e&&e.code;if((c==="store_unavailable"||c==="rate_limited")&&tent<2){tent++;await new Promise(r=>setTimeout(r,c==="rate_limited"?6000:1500));continue;}
          if(c==="not_granted"||c==="capability_disabled"||c==="upstream_auth"){d.env="";refazCorpo();toast("O envio de arquivos foi bloqueado nesta conta. Recarregue o painel ou peça acesso de Editor.");return;}
          if(c==="quota_or_state"){d.env="";refazCorpo();toast("O espaço de arquivos do painel acabou. Avise o Tarcisio.");return;}
          falhas.push(a.caminho.split("/").pop()+(c==="too_large"?" (grande demais)":""));break;}}}
    const id=uid("nf");
    const doc={id,nome:String(f.nome).trim(),codigo:String(f.codigo||"").trim(),fin:d.fin,pasta:f.pasta||"",arquivos,status:arquivos.length?"aguardando":"problema",
      msg:falhas.length?`Não subiram: ${falhas.slice(0,6).join(", ")}${falhas.length>6?"…":""}`:"",por:quem(),em:new Date().toISOString()};
    if(await escrever(()=>DB.doc("novas/"+id).set(clone(doc)),null)){DATA.novas[id]=doc;nOk++;}}

  case "nf-del-sim": ST.nfConf=null;if(await escrever(()=>DB.doc("novas/"+d.id).delete(),"Tirada da lista.")){delete DATA.novas[d.id];}s&&s.kind==="novafaz"?refazCorpo():render();break;
  case "tela-padrao": TELA.tema="auto";TELA.brilho=100;TELA.letra=100;aplicarTela();refazCorpo();break;
  }
}
async function salvarRDO(msg){
  const r=RED;if(!r.id){r.id=uid("rd");r.por=quem();r.criadoEm=new Date().toISOString();r.ord=Date.now();}
  const doc=clone(r);delete doc.conf;const L={};for(const k in doc.linhas){const it=doc.linhas[k];if(it)L[k]=Object.assign(limpo(it),{q:n0(it.q),src:it.src||""});}doc.linhas=L;
  if(await escrever(()=>DB.doc("rdo/"+r.id).set(doc),msg)){DATA.rdo[r.id]=clone(doc);RED=clone(doc);RED.linhas=Object.fromEntries(Object.entries(doc.linhas).map(([k,v])=>[k,Object.assign({},v,{q:String(v.q).replace(".",",")})]));}
  render();
}

(async function iniciar(){
  ["os","lanc","rdo","config","mapas","marcas","trechos","novas"].forEach(col=>{const m={};snapCol(col).docs.forEach(x=>{m[x.id]=Object.assign({},x.data(),{id:x.id});});DATA[col]=m;});render();
  const cl=window.claude&&typeof window.claude.use==="function"?window.claude:null;
  const use=n=>cl?cl.use(n).catch(()=>null):Promise.resolve(null);
  const [db,sample,down,assets,user]=await Promise.all([use("db"),use("sample"),use("downloads"),use("assets"),use("user")]);
  DB=DBF;if(db){NUVEMDB=db;NUVEM=true;}
  SAMPLE=sample;DOWN=down;ASSETS=assets;USER=user;
  if(USER){try{ME.id=await USER.id();}catch(e){}try{ADM=!!(await USER.isOwner())||!!(await USER.canEdit());}catch(e){}}
  else{try{ADM=localStorage.getItem("painel_adm_local")==="1";}catch(e){}}
  pronto=true;
  if(NUVEMDB){["os","lanc","rdo","config","mapas","marcas","trechos","novas"].forEach(col=>NUVEMDB.collection(col).onSnapshot(snap=>{
      if(snap.metadata&&snap.metadata.fromCache&&snap.empty)return;
      Object.keys(CACHE).forEach(k=>{if(colDe(k)===col)delete CACHE[k];});
      snap.docs.forEach(x=>{const v=x.data();if(v)CACHE[col+"/"+x.id]=v;});
      FILA.forEach(op=>{if(colDe(op.path)===col)aplicarLocal(op);});
      salvarCache();avisarCol(col);chipFila();
    },err=>{if(err&&err.code==="revoked")toast("O acesso a este painel mudou. Recarregue a página.");}));
    enviarFila();}
  const ouvir=(col)=>DB.collection(col).onSnapshot(snap=>{
    const m={};snap.docs.forEach(x=>{const v=x.data();if(v)m[x.id]=Object.assign({},v,{id:x.id});});DATA[col]=m;
    if(col==="rdo"&&RED&&RED.id&&m[RED.id]&&m[RED.id].status!==RED.status&&!RED.conf){RED=clone(m[RED.id]);}
    resolverNomes();pedirRender();
    const s=topo();if(s&&s.kind==="lanc"&&col==="lanc")refazCorpo();if(s&&s.kind==="novafaz"&&(col==="novas"||col==="mapas")&&!s.d.env&&!s.d.lendo&&!s.d.faz.length)refazCorpo();
  },err=>{if(err&&err.code==="revoked")toast("O acesso a este painel mudou. Recarregue a página.");});
  ouvir("os");ouvir("lanc");ouvir("rdo");ouvir("config");ouvir("mapas");ouvir("marcas");ouvir("trechos");ouvir("novas");
  render();
})();
})();

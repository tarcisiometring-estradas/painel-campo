name: Baixar estradas para rota
on:
  push:
    branches: [dados-rodovias]
    paths: [".github/workflows/rodovias.yml"]
permissions:
  contents: write
jobs:
  estradas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Baixar OpenStreetMap Centro-Oeste e recortar a região das fazendas
        run: |
          mkdir -p /tmp/osm && cd /tmp/osm
          curl -sSL -o co.pbf https://download.geofabrik.de/south-america/brazil/centro-oeste-latest.osm.pbf
          osmium extract -b -54.8,-21.9,-50.6,-16.9 co.pbf -o reg.pbf --overwrite
          osmium tags-filter -o vias.pbf reg.pbf w/highway=motorway,trunk,primary,secondary,tertiary,unclassified,residential,service,track,road,motorway_link,trunk_link,primary_link,secondary_link,tertiary_link,living_street --overwrite
          osmium export vias.pbf -o vias.geojsonseq -f geojsonseq --geometry-types=linestring --overwrite
          python3 - <<'PY'
          import json
          out=[]
          for ln in open('vias.geojsonseq'):
            ln=ln.strip().lstrip('\x1e')
            if not ln: continue
            f=json.loads(ln);p=f['properties']
            if p.get('access') in ('private','no') and p.get('highway') in ('service',): continue
            c=[[round(x,5),round(y,5)] for x,y in f['geometry']['coordinates']]
            out.append([p.get('highway',''),p.get('ref',''),p.get('name',''),p.get('surface',''),p.get('oneway',''),c])
          json.dump(out,open('vias.json','w'),separators=(',',':'),ensure_ascii=False)
          print(len(out))
          PY
          mkdir -p $GITHUB_WORKSPACE/fontes && gzip -9 -c vias.json > $GITHUB_WORKSPACE/fontes/vias_regiao.json.gz && ls -la $GITHUB_WORKSPACE/fontes
      - name: Guardar no ramo
        run: |
          git config user.name "rodovias-bot"; git config user.email "rodovias-bot@users.noreply.github.com"
          git add fontes && git commit -m "Estradas da região (OpenStreetMap) para rota" && git push

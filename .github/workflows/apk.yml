name: APK Android
on:
  push:
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Gerar APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publicar o APK no site do app
        run: |
          mkdir -p apk && cp android/app/build/outputs/apk/release/app-release.apk apk/EstradasSucuriu.apk
          git config user.name "Gerador do APK" && git config user.email "actions@users.noreply.github.com"
          git add apk/EstradasSucuriu.apk && git commit -m "APK Android atualizado" && git pull --rebase && git push || echo "sem mudança"

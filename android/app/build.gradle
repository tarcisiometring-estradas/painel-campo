plugins { id 'com.android.application' }
android {
  namespace 'br.sucuriu.estradas'
  compileSdk 36
  defaultConfig {
    applicationId 'br.com.malhamaps.app'
    minSdk 24
    targetSdk 36
    versionCode 9
    versionName '1.8'
  }
  signingConfigs {
    fixo {
      storeFile file('estradas.keystore')
      storePassword 'estradas'
      keyAlias 'estradas'
      keyPassword 'estradas'
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.fixo
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies { implementation 'androidx.core:core:1.13.1' }
